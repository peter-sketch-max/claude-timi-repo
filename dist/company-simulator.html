<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Company Simulator</title>
<meta name="description" content="Start a tiny company, make choices, survive crazy weeks and build a giant empire!">
<meta name="theme-color" content="#2B2250">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Company Sim">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800&display=swap">
<style>
/* Company Simulator — bright cartoon game style.
   One committed look (sky blue, white sticker cards, thick grape outlines, candy buttons),
   so colors are set explicitly and do not switch with the system theme. */
:root {
  color-scheme: light;
  --sky-1: #3EC5FF;
  --sky-2: #8EE3FF;
  --ink: #2B2250;
  --ink-2: #625A8C;
  --ink-3: #9A93BD;
  --paper: #FFFFFF;
  --paper-2: #F3F0FF;
  --line: #2B2250;
  --green: #22C55E; --green-d: #15803D;
  --yellow: #FFC93C; --yellow-d: #D99A00;
  --pink: #FF5FA2; --pink-d: #C9306F;
  --purple: #7C4DFF; --purple-d: #5528D6;
  --orange: #FF8A3D; --orange-d: #D0621B;
  --red: #FF4D5E; --red-d: #C7283A;
  --blue: #2EA8FF; --blue-d: #0B78CC;
  --teal: #20C997; --teal-d: #0E9B72;
  --display: 'Fredoka', 'Baloo 2', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Nunito', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r: 20px;
  --stroke: 3px;
  --pop: 0 5px 0 var(--ink);
  --nav-h: 70px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font: 700 15px/1.4 var(--body);
  background-color: var(--sky-1);
  background-image:
    radial-gradient(circle at 20px 20px, rgba(255, 255, 255, .22) 3px, transparent 4px),
    linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 100%);
  background-size: 40px 40px, 100% 100%;
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; font-weight: 700; letter-spacing: .005em; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; font-weight: 600; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.good { color: var(--green-d); }
.bad { color: var(--red-d); }
.wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; }
.label { font-family: var(--display); font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }

/* ---------- sticker cards & candy buttons ---------- */
.card { background: var(--paper); border: var(--stroke) solid var(--line); border-radius: var(--r); box-shadow: var(--pop); padding: 14px; }
.card + .card { margin-top: 12px; }
.section { margin-top: 18px; }
.section-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px 10px; }
.section-head h3 { font-size: 20px; color: #fff; text-shadow: 0 2px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink), 2px 2px 0 var(--ink), -2px 2px 0 var(--ink); }
.section-head .label { color: var(--ink); background: rgba(255, 255, 255, .7); padding: 3px 9px; border-radius: 99px; }

.btn {
  --c: var(--paper); --cd: var(--ink); --t: var(--ink);
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--c); color: var(--t); border: var(--stroke) solid var(--line); border-radius: 16px;
  box-shadow: 0 4px 0 var(--ink); padding: 10px 16px; min-height: 48px;
  font-family: var(--display); font-weight: 600; font-size: 16px; letter-spacing: .01em;
  transition: transform .06s, box-shadow .06s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn.green { --c: var(--green); --t: #fff; }
.btn.yellow { --c: var(--yellow); }
.btn.pink { --c: var(--pink); --t: #fff; }
.btn.purple { --c: var(--purple); --t: #fff; }
.btn.blue { --c: var(--blue); --t: #fff; }
.btn.red { --c: var(--red); --t: #fff; }
.btn.orange { --c: var(--orange); --t: #fff; }
.btn.small { min-height: 38px; padding: 6px 12px; font-size: 14px; border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
.btn.block { width: 100%; }
.btn.big { min-height: 60px; font-size: 20px; border-radius: 20px; }
.btn[disabled] { filter: grayscale(.9); opacity: .55; pointer-events: none; }
.btn .tag { font-size: 12px; background: rgba(43, 34, 80, .12); border-radius: 99px; padding: 2px 8px; }
.btn.green .tag, .btn.pink .tag, .btn.purple .tag, .btn.blue .tag, .btn.red .tag { background: rgba(255, 255, 255, .25); }

.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 99px; font-size: 13px; font-weight: 800; border: 2px solid var(--line); background: var(--paper); white-space: nowrap; }
.chip.good { background: #DCFCE7; color: var(--green-d); }
.chip.bad { background: #FFE1E5; color: var(--red-d); }
.chip.gold { background: #FFF2C6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

.bar { height: 12px; border-radius: 99px; background: var(--paper-2); border: 2px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 99px; }
.bar i.mid { background: var(--yellow); }
.bar i.low { background: var(--red); }

/* ---------- title screen ---------- */
.title-screen { min-height: 100%; display: flex; flex-direction: column; justify-content: center; padding-block: 28px 36px; gap: 14px; }
.logo-big { text-align: center; }
.logo-big .bld { font-size: 64px; line-height: 1; display: inline-block; animation: bob 2.4s ease-in-out infinite; }
.logo-big h1 {
  font-size: clamp(40px, 12vw, 58px); line-height: .95; color: #fff; margin-top: 8px;
  text-shadow: 0 4px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 3px 4px 0 var(--ink), -3px 4px 0 var(--ink);
}
.logo-big h1 span { color: var(--yellow); }
.logo-big p { margin: 10px auto 0; max-width: 30ch; font-size: 16px; color: var(--ink); background: rgba(255, 255, 255, .75); border-radius: 14px; padding: 6px 12px; }
.floaters { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.floaters span { position: absolute; font-size: 30px; opacity: .8; animation: floatUp linear infinite; }
@keyframes floatUp { from { transform: translateY(110vh) rotate(0); } to { transform: translateY(-15vh) rotate(25deg); } }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-3deg); } }
.title-screen > * { position: relative; z-index: 1; }
.cont-card { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; }
.cont-card .grow { flex: 1; min-width: 0; }
.daily-card { background: linear-gradient(135deg, #FFF2C6, #FFE0F0); }
.daily-card .row { display: flex; align-items: center; gap: 12px; }
.daily-card .ico { font-size: 40px; }

/* ---------- create ---------- */
.create { padding-block: 16px 120px; }
.steps { display: flex; gap: 6px; margin: 4px 0 16px; }
.steps i { flex: 1; height: 10px; border-radius: 99px; background: rgba(255, 255, 255, .6); border: 2px solid var(--line); }
.steps i.on { background: var(--yellow); }
.create h2 { font-size: 30px; color: #fff; text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); }
.create .sub { margin: 6px 0 16px; font-size: 16px; }
.field { display: grid; gap: 8px; margin-bottom: 16px; }
.field input { font: 700 20px var(--display); padding: 12px 14px; border-radius: 16px; border: var(--stroke) solid var(--line); background: #fff; color: var(--ink); width: 100%; box-shadow: inset 0 3px 0 rgba(43, 34, 80, .08); }
.name-row { display: flex; gap: 8px; }
.name-row input { flex: 1; min-width: 0; }
.logo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.logo-grid button { aspect-ratio: 1; border-radius: 16px; border: var(--stroke) solid var(--line); background: #fff; font-size: 28px; box-shadow: 0 3px 0 var(--ink); }
.logo-grid button.on { background: var(--yellow); transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.color-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
.color-row button { aspect-ratio: 1; border-radius: 50%; border: var(--stroke) solid var(--line); }
.color-row button.on { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink); }
.logo { display: grid; place-items: center; border-radius: 16px; flex: none; border: var(--stroke) solid var(--line); }
.preview { display: flex; align-items: center; gap: 12px; }
.preview .logo { width: 64px; height: 64px; font-size: 36px; border-radius: 20px; box-shadow: 0 4px 0 var(--ink); }
.preview strong { font-family: var(--display); font-size: 24px; }

.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
.tabs button { border: var(--stroke) solid var(--line); border-radius: 14px; background: #fff; padding: 8px 4px; font-family: var(--display); font-weight: 600; box-shadow: 0 3px 0 var(--ink); }
.tabs button.on { background: var(--purple); color: #fff; }
.tabs button small { display: block; font-size: 11px; }
.tier-note { margin: 0 0 12px; font-size: 15px; background: rgba(255, 255, 255, .75); border-radius: 14px; padding: 8px 12px; }
.pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { text-align: center; padding: 12px 8px; border: var(--stroke) solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 4px 0 var(--ink); display: grid; gap: 2px; }
.pick .e { font-size: 36px; line-height: 1.1; }
.pick b { font-family: var(--display); font-size: 16px; font-weight: 600; }
.pick small { font-size: 12px; color: var(--ink-2); }
.pick.on { background: var(--yellow); transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.pick-list { display: grid; gap: 10px; }
.pick-row { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 12px 14px; border: var(--stroke) solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 4px 0 var(--ink); }
.pick-row .e { font-size: 32px; }
.pick-row .grow { flex: 1; min-width: 0; }
.pick-row b { display: block; font-family: var(--display); font-weight: 600; font-size: 17px; }
.pick-row small { color: var(--ink-2); font-size: 13px; }
.pick-row .side { text-align: right; font-size: 13px; }
.pick-row.on { background: var(--yellow); }
.create-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: rgba(255, 255, 255, .85); border-top: var(--stroke) solid var(--line); backdrop-filter: blur(6px); }
.create-bar .wrap { display: flex; gap: 10px; padding: 0; }
.create-bar .btn { flex: 1; }

/* ---------- HUD ---------- */
.game { padding-bottom: calc(var(--nav-h) + 100px + env(safe-area-inset-bottom, 0px)); }
.hud { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; background: var(--ink); color: #fff; border-radius: 0 0 22px 22px; box-shadow: 0 4px 0 rgba(43, 34, 80, .35); }
.hud .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px 12px; }
.hud .logo { width: 44px; height: 44px; font-size: 24px; border-color: #fff; }
.hud .who { flex: 1; min-width: 0; }
.hud .who b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .who small { font-size: 12px; opacity: .85; }
.coin { display: inline-flex; align-items: center; gap: 6px; background: var(--yellow); color: var(--ink); border: 3px solid #fff; border-radius: 99px; padding: 3px 12px 3px 5px; font-family: var(--display); font-weight: 600; font-size: 17px; }
.coin i { width: 24px; height: 24px; border-radius: 50%; background: #FFE27A; border: 2px solid var(--yellow-d); display: grid; place-items: center; font-style: normal; font-size: 13px; }
.coin.neg { background: var(--red); color: #fff; }
.lvl { position: relative; width: 44px; height: 44px; flex: none; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 17px; }
.lvl svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.lvl .n { position: relative; z-index: 1; color: #fff; }
.lvl small { position: absolute; z-index: 1; color: #fff; bottom: -6px; font-size: 9px; background: var(--purple); border-radius: 6px; padding: 0 4px; line-height: 13px; }
.rank { display: inline-block; font-size: 11px; background: rgba(255, 255, 255, .16); border-radius: 99px; padding: 1px 8px; margin-top: 2px; }

/* ---------- home ---------- */
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { --c: var(--yellow); border: var(--stroke) solid var(--line); border-radius: 18px; background: var(--c); box-shadow: 0 4px 0 var(--ink); padding: 8px 4px 7px; text-align: center; color: var(--ink); }
.stat .e { font-size: 22px; line-height: 1; }
.stat b { display: block; font-family: var(--display); font-weight: 600; font-size: 20px; line-height: 1.15; margin-top: 3px; }
.stat small { display: block; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.stat .mini { height: 6px; margin: 4px 6px 0; border-radius: 99px; background: rgba(255, 255, 255, .55); overflow: hidden; }
.stat .mini i { display: block; height: 100%; background: var(--ink); border-radius: 99px; }
.stat.rep { --c: #FFD84D; } .stat.happy { --c: #FF8FC0; } .stat.mood { --c: #FFB37A; } .stat.fans { --c: #7FD0FF; }

.mentor { display: flex; gap: 10px; align-items: flex-start; }
.mentor .owl { font-size: 38px; line-height: 1; flex: none; animation: bob 2.6s ease-in-out infinite; }
.mentor .bubble { position: relative; flex: 1; background: #fff; border: var(--stroke) solid var(--line); border-radius: 18px; padding: 10px 12px; font-size: 15px; box-shadow: 0 4px 0 var(--ink); }
.mentor .bubble::before { content: ''; position: absolute; left: -11px; top: 14px; border: 8px solid transparent; border-right-color: var(--line); }
.mentor .bubble b { color: var(--purple-d); }

.week-card .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.big-money { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.1; }
.served { margin-top: 10px; font-size: 14px; }
.served .bar { margin-top: 6px; height: 16px; }
.hint { margin-top: 8px; font-size: 14px; background: #FFF2C6; border: 2px dashed var(--yellow-d); border-radius: 12px; padding: 6px 10px; }
.hint.bad { background: #FFE1E5; border-color: var(--red-d); color: var(--ink); }

.mission { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 2px dashed var(--paper-2); }
.mission:last-child { border-bottom: 0; padding-bottom: 0; }
.mission:first-child { padding-top: 0; }
.mission .e { font-size: 28px; flex: none; width: 36px; text-align: center; }
.mission .grow { flex: 1; min-width: 0; }
.mission .grow b { display: block; font-size: 15px; }
.mission .grow small { font-size: 12px; color: var(--ink-2); }
.mission .bar { height: 10px; margin-top: 4px; }
.mission .btn { animation: wiggle 1.2s ease-in-out infinite; }
@keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.action { border: var(--stroke) solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 10px 4px; text-align: center; font-family: var(--display); font-weight: 600; font-size: 14px; color: #fff; display: grid; gap: 2px; justify-items: center; }
.action .e { font-size: 28px; }
.action small { font-family: var(--body); font-size: 11px; font-weight: 800; opacity: .9; }
.action:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.action.pink { background: var(--pink); } .action.orange { background: var(--orange); } .action.purple { background: var(--purple); }
.action.done { background: #C9C4E0; color: var(--ink); }

.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { border: var(--stroke) solid var(--line); border-radius: 14px; background: #fff; padding: 8px 4px; font-family: var(--display); font-weight: 600; font-size: 14px; box-shadow: 0 3px 0 var(--ink); }
.seg button small { display: block; font-family: var(--body); font-size: 11px; color: var(--ink-2); }
.seg button.on { background: var(--teal); color: #fff; transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.seg button.on small { color: #fff; }

.gift-banner { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: linear-gradient(90deg, var(--yellow), #FFB0D4); }
.gift-banner .e { font-size: 36px; animation: wiggle 1s ease-in-out infinite; }

.news-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 2px dashed var(--paper-2); font-size: 14px; }
.news-item:last-child { border-bottom: 0; }
.news-item .wk { font-family: var(--display); font-size: 12px; background: var(--paper-2); border-radius: 8px; padding: 1px 6px; height: fit-content; flex: none; }
.news-item.good .wk { background: #DCFCE7; } .news-item.bad .wk { background: #FFE1E5; }

.mods { display: grid; gap: 6px; }
.mod { font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }

/* ---------- team ---------- */
.summary3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.summary3 div { background: var(--paper-2); border-radius: 14px; padding: 8px 4px; }
.summary3 b { display: block; font-family: var(--display); font-weight: 600; font-size: 20px; }
.summary3 small { font-size: 11px; color: var(--ink-2); }
.person { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: #fff; border: var(--stroke) solid var(--line); border-radius: 18px; padding: 8px 12px; box-shadow: 0 4px 0 var(--ink); }
.person + .person { margin-top: 10px; }
.face { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-size: 28px; flex: none; border: var(--stroke) solid var(--line); position: relative; }
.face .mood { position: absolute; right: -6px; bottom: -6px; font-size: 16px; background: #fff; border-radius: 50%; width: 22px; height: 22px; display: grid; place-items: center; border: 2px solid var(--line); }
.person .grow { flex: 1; min-width: 0; }
.person .grow b { display: block; font-family: var(--display); font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person .grow small { color: var(--ink-2); font-size: 12px; }
.person .side { display: grid; gap: 4px; justify-items: end; font-size: 12px; }
.skillbar { width: 64px; height: 8px; border-radius: 99px; background: var(--paper-2); overflow: hidden; border: 2px solid var(--line); }
.skillbar i { display: block; height: 100%; background: var(--blue); }
.trait { display: inline-flex; gap: 4px; align-items: center; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 99px; border: 2px solid var(--line); background: #fff; }
.trait.good { background: #DCFCE7; } .trait.bad { background: #FFE1E5; } .trait.unk { background: var(--paper-2); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat-grid div { background: var(--paper-2); border-radius: 14px; padding: 8px 10px; }
.stat-grid b { display: block; font-family: var(--display); font-weight: 600; font-size: 20px; }
.stat-grid small { color: var(--ink-2); font-size: 11px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ---------- shop ---------- */
.up-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.up { background: #fff; border: var(--stroke) solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); padding: 10px; display: grid; gap: 6px; align-content: start; }
.up .e { font-size: 32px; line-height: 1; }
.up b { font-family: var(--display); font-weight: 600; font-size: 16px; }
.up small { font-size: 12px; color: var(--ink-2); min-height: 32px; }
.pips { display: flex; gap: 4px; }
.pips i { width: 16px; height: 8px; border-radius: 4px; background: var(--paper-2); border: 2px solid var(--line); }
.pips i.on { background: var(--green); }
.ad-row { display: flex; align-items: center; gap: 10px; }
.ad-row .e { font-size: 30px; }
.ad-row .grow { flex: 1; }
.ad-row + .ad-row { margin-top: 10px; padding-top: 10px; border-top: 2px dashed var(--paper-2); }

/* ---------- money ---------- */
.loan { display: flex; align-items: center; gap: 10px; }
.loan + .loan { margin-top: 10px; padding-top: 10px; border-top: 2px dashed var(--paper-2); }
.loan .grow { flex: 1; }
.table-wrap { overflow-x: auto; }
.hist { width: 100%; border-collapse: collapse; font-size: 14px; }
.hist th { text-align: right; font-family: var(--display); font-weight: 600; font-size: 12px; color: var(--ink-2); padding: 4px 6px; }
.hist td { text-align: right; padding: 6px; border-top: 2px dashed var(--paper-2); font-family: var(--display); font-weight: 500; }
.hist th:first-child, .hist td:first-child { text-align: left; }

/* ---------- goals ---------- */
.ach-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.ach { background: #fff; border: var(--stroke) solid var(--line); border-radius: 16px; padding: 10px; display: flex; gap: 8px; align-items: center; box-shadow: 0 3px 0 var(--ink); }
.ach .e { font-size: 28px; }
.ach b { display: block; font-size: 13px; line-height: 1.2; }
.ach small { font-size: 11px; color: var(--ink-2); }
.ach.locked { background: var(--paper-2); box-shadow: none; }
.ach.locked .e { filter: grayscale(1); opacity: .4; }
.book { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.bk { aspect-ratio: 1; border-radius: 14px; border: var(--stroke) solid var(--line); display: grid; place-items: center; font-size: 26px; background: #fff; position: relative; }
.bk.unk { background: var(--paper-2); color: var(--ink-3); font-family: var(--display); }
.bk.rare { background: #DDEBFF; } .bk.epic { background: #EADDFF; } .bk.legendary { background: linear-gradient(135deg, #FFE27A, #FFB0D4); }
.bk.unk.rare, .bk.unk.epic, .bk.unk.legendary { filter: saturate(.5); }
.progress-big { height: 18px; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; font-size: 16px; }
.switch { width: 58px; height: 32px; border-radius: 99px; border: var(--stroke) solid var(--line); background: var(--paper-2); position: relative; }
.switch i { position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2px solid var(--line); transition: left .15s; }
.switch.on { background: var(--green); }
.switch.on i { left: 28px; }

/* ---------- next week & nav ---------- */
.dock { position: fixed; left: 0; right: 0; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px)); z-index: 7; pointer-events: none; }
.dock .wrap { padding-block: 10px; }
.next {
  pointer-events: auto; width: 100%; min-height: 70px; border: 4px solid var(--line); border-radius: 24px;
  background: var(--green); color: #fff; box-shadow: 0 6px 0 var(--ink); display: flex; align-items: center; justify-content: center; gap: 12px;
  font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .03em; text-shadow: 0 2px 0 rgba(0, 0, 0, .2);
  animation: breathe 2.2s ease-in-out infinite; position: relative;
}
.next .wk { position: absolute; top: -14px; right: 16px; background: var(--yellow); color: var(--ink); font-size: 13px; border: 3px solid var(--line); border-radius: 99px; padding: 1px 10px; text-shadow: none; transform: rotate(4deg); }
.next:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); animation: none; }
.next.pending { background: var(--orange); }
@keyframes breathe { 50% { transform: scale(1.02); } }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: #fff; border-top: var(--stroke) solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav .wrap { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); padding-inline: 6px; gap: 4px; align-items: center; }
.nav button { border: 0; background: none; display: grid; justify-items: center; gap: 1px; padding: 6px 0; border-radius: 16px; font-family: var(--display); font-weight: 600; font-size: 12px; color: var(--ink-2); position: relative; }
.nav button .e { font-size: 24px; line-height: 1.1; transition: transform .15s; }
.nav button.on { background: var(--paper-2); color: var(--ink); }
.nav button.on .e { transform: translateY(-2px) scale(1.12); }
.nav .badge { position: absolute; top: 2px; right: 18%; min-width: 18px; height: 18px; background: var(--red); color: #fff; border: 2px solid var(--line); border-radius: 99px; font-size: 10px; line-height: 14px; padding: 0 3px; }

/* ---------- sheets ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(43, 34, 80, .55); display: flex; align-items: flex-end; justify-content: center; }
.scrim.enter { animation: fade .2s ease-out; }
.sheet {
  width: 100%; max-width: 520px; max-height: 94%; overflow-y: auto; background: var(--paper);
  border: 4px solid var(--line); border-bottom: 0; border-radius: 28px 28px 0 0;
  padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px));
}
.scrim.enter .sheet { animation: up .3s cubic-bezier(.2, 1.3, .4, 1); }
@media (min-width: 700px) {
  .scrim { align-items: center; }
  .sheet { border-radius: 28px; border-bottom: 4px solid var(--line); max-height: 88%; }
}
@keyframes up { from { transform: translateY(60px); opacity: .3; } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
.grab { width: 48px; height: 6px; border-radius: 6px; background: var(--paper-2); margin: 10px auto 6px; }

.ev-head { margin: 0 -16px 0; padding: 16px 16px 44px; background: var(--c, var(--blue)); border-bottom: 4px solid var(--line); position: relative; color: #fff; }
.ev-head .meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; font-size: 13px; }
.ev-head .meta span { background: rgba(0, 0, 0, .18); border-radius: 99px; padding: 3px 10px; }
.ev-icon { position: absolute; left: 50%; bottom: -38px; transform: translateX(-50%); width: 80px; height: 80px; border-radius: 50%; background: #fff; border: 4px solid var(--line); display: grid; place-items: center; font-size: 44px; box-shadow: 0 5px 0 var(--ink); animation: pop .45s ease-out; }
.ev-body { padding-top: 48px; text-align: center; }
.ev-body h2 { font-size: 25px; line-height: 1.15; }
.ev-text { font-size: 17px; margin: 10px 0 16px; color: var(--ink-2); white-space: pre-line; }
.rarity { font-family: var(--display); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; border-radius: 99px; padding: 3px 10px; border: 2px solid var(--line); color: var(--ink); }
.rarity.rare { background: #BFD9FF; } .rarity.epic { background: #D7C2FF; } .rarity.legendary { background: linear-gradient(90deg, #FFE27A, #FFB0D4, #B9F3FF); animation: shimmer 2s linear infinite; background-size: 200% 100%; }
@keyframes shimmer { to { background-position: 200% 0; } }
.options { display: grid; gap: 10px; text-align: left; }
.option { width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #fff; border: var(--stroke) solid var(--line); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); padding: 12px 14px; font-size: 16px; }
.option:hover { background: var(--paper-2); }
.option:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.option small { display: block; font-size: 12px; color: var(--ink-2); }
.option .tags, .reply .tags { display: flex; gap: 4px; flex: none; }
.option .tag, .reply .tag { font-size: 12px; font-weight: 800; border-radius: 99px; padding: 2px 8px; border: 2px solid var(--line); white-space: nowrap; }
.tag.cost { background: #FFE1E5; } .tag.risk { background: #FFF2C6; }

/* chat */
.phone { background: #EEF6FF; border: var(--stroke) solid var(--line); border-radius: 22px; padding: 10px; margin: 6px 0 14px; text-align: left; }
.phone .who { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; border-bottom: 2px solid #D5E6FA; margin-bottom: 8px; font-family: var(--display); font-weight: 600; }
.phone .who .face { width: 36px; height: 36px; font-size: 20px; border-width: 2px; }
.phone .who small { display: block; font-family: var(--body); font-size: 11px; color: var(--green-d); }
.msg { display: table; max-width: 85%; background: #fff; border: 2px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 7px 12px; margin: 6px 0; font-size: 16px; animation: pop .35s ease-out backwards; }
.msg.me { margin-left: auto; background: var(--blue); color: #fff; border-radius: 16px 16px 4px 16px; }
.reply { width: 100%; text-align: left; background: var(--blue); color: #fff; border: var(--stroke) solid var(--line); border-radius: 18px 18px 6px 18px; box-shadow: 0 4px 0 var(--ink); padding: 11px 14px; font-size: 16px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.reply:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.reply .tag { color: var(--ink); }

/* review */
.review { background: #fff; border: var(--stroke) solid var(--line); border-radius: 18px; padding: 12px 14px; margin: 4px 0 14px; text-align: left; box-shadow: 0 4px 0 var(--ink); }
.stars { color: #FFB800; font-size: 24px; letter-spacing: 2px; -webkit-text-stroke: 1px var(--ink); }
.stars .off { color: #E5E1F5; }
.review .by { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 600; }
.review q { display: block; margin-top: 6px; font-size: 16px; font-style: italic; quotes: '“' '”'; }

/* news */
.breaking { display: inline-block; background: var(--red); color: #fff; font-family: var(--display); font-weight: 700; letter-spacing: .12em; border: 3px solid var(--line); border-radius: 10px; padding: 2px 10px; transform: rotate(-2deg); margin-bottom: 8px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { background: var(--orange); } }
.newspaper { background: #FFFBEF; border: var(--stroke) solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 14px; font-family: Georgia, 'Times New Roman', serif; }
.newspaper h2 { font-family: Georgia, 'Times New Roman', serif; font-weight: 700; font-size: 24px; }

/* result */
.result { text-align: center; padding-top: 18px; }
.result .face-big { font-size: 72px; line-height: 1; animation: pop .5s ease-out; }
.result h2 { font-size: 24px; margin-top: 8px; }
.result p { font-size: 18px; margin: 10px 0 14px; white-space: pre-line; }
.result .chips { justify-content: center; margin-bottom: 16px; }
.result .chip { font-size: 14px; padding: 6px 12px; animation: pop .4s ease-out backwards; }
.banner { border: var(--stroke) solid var(--line); border-radius: 16px; padding: 10px 12px; margin: 10px 0; font-family: var(--display); font-weight: 600; font-size: 16px; box-shadow: 0 3px 0 var(--ink); animation: pop .5s ease-out backwards; text-align: center; }
.banner.gold { background: linear-gradient(90deg, #FFE27A, #FFC93C); }
.banner.purple { background: var(--purple); color: #fff; }
.banner.pink { background: var(--pink); color: #fff; }
.banner.green { background: var(--green); color: #fff; }
.banner.red { background: #FFE1E5; }

/* week report */
.wk-title { text-align: center; padding-top: 16px; }
.wk-title .cal { display: inline-block; font-size: 44px; animation: pop .4s ease-out; }
.wk-title h2 { font-size: 30px; }
.wk-title p { margin: 2px 0 0; color: var(--ink-2); }
.money-pop { text-align: center; font-family: var(--display); font-weight: 700; font-size: 44px; margin: 8px 0; }
.ledger { width: 100%; border-collapse: collapse; font-size: 15px; }
.ledger td { padding: 5px 0; }
.ledger td:last-child { text-align: right; font-family: var(--display); font-weight: 600; }
.happen { display: grid; gap: 8px; margin: 12px 0; }
.happen div { background: var(--paper-2); border-radius: 14px; padding: 9px 12px; font-size: 15px; text-align: left; }

/* minigames */
.boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 14px; }
.box { aspect-ratio: 1; border: var(--stroke) solid var(--line); border-radius: 20px; background: var(--pink); box-shadow: 0 5px 0 var(--ink); font-size: 48px; display: grid; place-items: center; animation: wiggle 1.4s ease-in-out infinite; }
.box:nth-child(2) { background: var(--purple); animation-delay: .2s; } .box:nth-child(3) { background: var(--blue); animation-delay: .4s; }
.box.open { animation: pop .4s ease-out; background: #fff; }
.box.open.mine { background: var(--yellow); }
.box small { display: block; font-size: 12px; font-weight: 800; }
.box.open { display: grid; align-content: center; gap: 4px; font-size: 40px; }

.wheel-wrap { position: relative; width: min(280px, 78vw); margin: 18px auto 14px; aspect-ratio: 1; }
.wheel-wrap svg { width: 100%; height: 100%; transition: transform 3.4s cubic-bezier(.12, .8, .1, 1); }
.wheel-pointer { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-size: 34px; z-index: 2; filter: drop-shadow(0 2px 0 var(--ink)); }
.wheel-hub { position: absolute; inset: 40%; border-radius: 50%; background: #fff; border: 4px solid var(--line); display: grid; place-items: center; font-size: 26px; }

.arena { position: relative; height: 280px; border: var(--stroke) solid var(--line); border-radius: 20px; background: repeating-linear-gradient(45deg, #EAF7FF, #EAF7FF 12px, #DDF1FF 12px, #DDF1FF 24px); overflow: hidden; margin: 6px 0 10px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.arena .target { position: absolute; font-size: 54px; width: 72px; height: 72px; display: grid; place-items: center; border: 0; background: none; padding: 0; transition: left .08s, top .08s; }
.arena .target:active { transform: scale(.85); }
.arena .hudline { position: absolute; left: 10px; right: 10px; top: 8px; display: flex; justify-content: space-between; font-family: var(--display); font-weight: 700; font-size: 20px; z-index: 2; pointer-events: none; }
.arena .start { position: absolute; inset: 0; display: grid; place-items: center; }
.timebar { height: 12px; border-radius: 99px; border: 2px solid var(--line); background: var(--paper-2); overflow: hidden; }
.timebar i { display: block; height: 100%; background: var(--orange); width: 100%; }
.pop-plus { position: absolute; font-family: var(--display); font-weight: 700; color: var(--green-d); font-size: 22px; pointer-events: none; animation: rise .6s ease-out forwards; }
@keyframes rise { to { transform: translateY(-40px); opacity: 0; } }

.quiz-q { background: var(--paper-2); border-radius: 16px; padding: 12px; font-size: 18px; margin-bottom: 14px; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.answers .btn { font-size: 22px; min-height: 64px; }
.answers .btn.right { --c: var(--green); --t: #fff; }
.answers .btn.wrong { --c: var(--red); --t: #fff; }

.offer { font-family: var(--display); font-weight: 700; font-size: 44px; color: var(--green-d); margin: 4px 0; }
.dots { display: flex; justify-content: center; gap: 6px; margin-bottom: 12px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: #fff; }
.dots i.on { background: var(--yellow); }

.versus { display: flex; align-items: center; justify-content: space-around; margin: 4px 0 12px; }
.versus .side { display: grid; justify-items: center; gap: 4px; font-family: var(--display); font-weight: 600; font-size: 14px; max-width: 40%; }
.versus .side .logo { width: 64px; height: 64px; font-size: 34px; box-shadow: 0 4px 0 var(--ink); }
.versus .vs { font-family: var(--display); font-weight: 700; font-size: 34px; color: var(--red); text-shadow: 0 3px 0 var(--ink); }
.versus .move { font-size: 44px; animation: pop .5s ease-out backwards; }
.rules { font-size: 13px; background: var(--paper-2); border-radius: 12px; padding: 6px 10px; margin-bottom: 12px; }
.moves { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.moves .btn { flex-direction: column; min-height: 88px; gap: 2px; font-size: 14px; }
.moves .btn span { font-size: 34px; }

.cand { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--paper-2); border-radius: 18px; padding: 10px 12px; margin-bottom: 12px; }
.cand .face { width: 60px; height: 60px; font-size: 34px; }

.post-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.post-opt { border: var(--stroke) solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); background: #fff; padding: 12px 8px; display: grid; justify-items: center; gap: 4px; }
.post-opt .e { font-size: 36px; }
.post-opt b { font-family: var(--display); font-weight: 600; }
.post-opt small { font-size: 11px; color: var(--ink-2); }
.post-opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.post-card { border: var(--stroke) solid var(--line); border-radius: 20px; overflow: hidden; margin: 10px 0 14px; text-align: left; }
.post-card .ph { background: linear-gradient(135deg, var(--pink), var(--purple)); height: 150px; display: grid; place-items: center; font-size: 72px; }
.post-card .metrics { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; padding: 10px 4px; }
.post-card .metrics b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; }
.post-card .metrics small { font-size: 11px; color: var(--ink-2); }
.viral-stamp { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 34px; color: #fff; background: var(--red); border: 4px solid var(--line); border-radius: 16px; padding: 2px 16px; transform: rotate(-6deg); animation: pop .6s ease-out; box-shadow: 0 5px 0 var(--ink); }

/* share card */
.share-img { width: 100%; border-radius: 18px; border: var(--stroke) solid var(--line); box-shadow: 0 4px 0 var(--ink); display: block; }
.share-text { width: 100%; min-height: 120px; font: 700 14px var(--body); border: var(--stroke) solid var(--line); border-radius: 14px; padding: 10px; margin: 12px 0; resize: none; color: var(--ink); background: var(--paper-2); }

/* toast & confetti */
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 60; background: #fff; color: var(--ink); border: var(--stroke) solid var(--line); box-shadow: 0 4px 0 var(--ink); padding: 10px 16px; border-radius: 16px; font-family: var(--display); font-weight: 600; font-size: 16px; max-width: calc(100% - 32px); animation: pop .35s ease-out; text-align: center; }
.confetti { position: fixed; top: -20px; width: 10px; height: 16px; z-index: 70; pointer-events: none; border-radius: 3px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

.gameover { padding-block: 40px; text-align: center; }
.gameover .face-big { font-size: 80px; animation: bob 2s ease-in-out infinite; }
.gameover h1 { font-size: 34px; color: #fff; text-shadow: 0 3px 0 var(--ink), 2px 0 0 var(--ink), -2px 0 0 var(--ink), 0 -2px 0 var(--ink); margin: 8px 0; }
.grid-emoji { font-size: 22px; letter-spacing: 2px; margin: 10px 0; }

@media (max-width: 360px) {
  .stats4 { grid-template-columns: repeat(2, 1fr); }
  .next { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* =====================================================================
   v3: loading screen, living scene, powers, rivals, VIP, celebrations,
   and entrance animations for everything.
   ===================================================================== */

.small { font-size: 13px; }

/* ---------- loading screen ---------- */
#loader {
  position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 14px; text-align: center; padding: 24px;
  background: radial-gradient(circle at 50% 35%, #8EE3FF, #3EC5FF 60%, #2A9FE0); color: var(--ink); transition: opacity .45s, transform .45s;
}
#loader .ld-logo { font-size: 84px; animation: bob 1.6s ease-in-out infinite; filter: drop-shadow(0 6px 0 rgba(43, 34, 80, .35)); }
#loader h1 { font-size: 42px; line-height: .95; color: #fff; text-shadow: 0 4px 0 var(--ink), 3px 0 0 var(--ink), -3px 0 0 var(--ink), 0 -3px 0 var(--ink), 3px 4px 0 var(--ink), -3px 4px 0 var(--ink); }
#loader h1 span { color: var(--yellow); }
#loader .ld-bar { width: min(260px, 70vw); height: 18px; border: 3px solid var(--ink); border-radius: 99px; background: #fff; overflow: hidden; box-shadow: 0 4px 0 var(--ink); }
#loader .ld-bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(45deg, var(--green), var(--green) 10px, #34D77B 10px, #34D77B 20px); animation: load 1.3s ease-out forwards; }
#loader .ld-tip { font-weight: 800; background: rgba(255, 255, 255, .8); border-radius: 12px; padding: 6px 12px; max-width: 30ch; }
#loader .ld-go { display: none; font-family: var(--display); font-weight: 700; font-size: 26px; color: #fff; background: var(--green); border: 4px solid var(--ink); border-radius: 22px; padding: 12px 34px; box-shadow: 0 6px 0 var(--ink); animation: breathe 1.4s ease-in-out infinite; }
#loader.ready .ld-go { display: block; }
#loader.ready .ld-bar { display: none; }
#loader.gone { opacity: 0; transform: scale(1.08); pointer-events: none; }
@keyframes load { to { width: 100%; } }

/* ---------- entrance animations ---------- */
@keyframes rise-in { from { transform: translateY(18px) scale(.97); opacity: 0; } }
.enter > .section, .enter > .card, .enter > .logo-big, .enter > .btn, .enter > h2, .enter > .steps,
.enter .pick, .enter .pick-row, .enter .person, .enter .up, .enter .ach, .enter .power, .enter .rv-row, .enter .perk {
  animation: rise-in .42s cubic-bezier(.2, 1.2, .4, 1) backwards;
  animation-delay: calc(var(--i, 0) * 45ms);
}
.enter > .section:nth-child(2) { animation-delay: 60ms; } .enter > .section:nth-child(3) { animation-delay: 120ms; }
.enter > .section:nth-child(4) { animation-delay: 180ms; } .enter > .section:nth-child(5) { animation-delay: 240ms; }
.enter > .section:nth-child(6) { animation-delay: 300ms; } .enter > .section:nth-child(n+7) { animation-delay: 340ms; }
.in { animation: rise-in .38s cubic-bezier(.2, 1.2, .4, 1) backwards; }
.perk { animation: rise-in .4s backwards; animation-delay: calc(var(--i, 0) * 60ms); }
.ev-card { animation: card-in .45s cubic-bezier(.2, 1.1, .4, 1); transform-origin: 50% 0; }
@keyframes card-in { from { transform: perspective(700px) rotateX(-18deg) translateY(20px); opacity: 0; } }
.scrim:not(.enter) .ev-card { animation: none; }
.bump { animation: bump .5s ease-out; }
@keyframes bump { 30% { transform: scale(1.12); } 60% { transform: scale(.96); } }
.shake { animation: shake .45s; }

.wiggle { animation: wiggle 1s ease-in-out infinite; }
.fire { animation: glow 1.4s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 4px rgba(255, 201, 60, .45); } }

/* ---------- HUD extras ---------- */
.hud-logo { position: relative; flex: none; }
.hud-boss { position: absolute; right: -8px; bottom: -8px; width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 2px solid var(--ink); display: grid; place-items: center; font-size: 14px; }
.vip-badge { font-size: 14px; }
.coin.bump { animation: bump .6s ease-out; }
.boss-face { font-size: 30px; margin-left: -18px; margin-top: 30px; background: #fff; border: 3px solid var(--line); border-radius: 50%; width: 42px; height: 42px; display: grid; place-items: center; flex: none; }

/* stat change bubbles */
.stat { position: relative; }
.stat .delta { position: absolute; top: -10px; right: -4px; font-family: var(--display); font-weight: 700; font-size: 12px; border: 2px solid var(--ink); border-radius: 99px; padding: 0 6px; animation: pop .4s ease-out, fadeaway 3s 1s forwards; }
.stat .delta.up { background: var(--green); color: #fff; }
.stat .delta.down { background: var(--red); color: #fff; }
@keyframes fadeaway { to { opacity: 0; transform: translateY(-8px); } }

/* ---------- living scene ---------- */
.scene-card { position: relative; border: var(--stroke) solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--pop); background: #6FD3FF; }
.scene-card canvas { display: block; width: 100%; height: 230px; touch-action: manipulation; }
.scene-hint { position: absolute; left: 10px; bottom: 8px; background: var(--yellow); border: 2px solid var(--ink); border-radius: 99px; padding: 3px 10px; font-family: var(--display); font-weight: 600; font-size: 13px; animation: wiggle 1s ease-in-out infinite; pointer-events: none; }

/* ---------- boss powers ---------- */
.powers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.power { position: relative; overflow: hidden; border: var(--stroke) solid var(--line); border-radius: 18px; box-shadow: 0 4px 0 var(--ink); background: linear-gradient(160deg, #FFE27A, #FFB020); padding: 8px 4px; display: grid; justify-items: center; gap: 1px; text-align: center; }
.power .e { font-size: 28px; line-height: 1.1; }
.power b { font-family: var(--display); font-weight: 600; font-size: 12px; line-height: 1.1; }
.power small { font-size: 10px; line-height: 1.15; color: var(--ink-2); }
.power.ready { animation: glow 1.6s ease-in-out infinite; }
.power.ready:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.power.cooling { background: #E9E5F7; filter: saturate(.4); }
.power .cd { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(43, 34, 80, .12); pointer-events: none; }
.power[disabled] { opacity: 1; }
.power-e { animation: spin-pop .7s ease-out; }
@keyframes spin-pop { from { transform: rotate(-200deg) scale(.2); } }

/* ---------- rivals & cup ---------- */
.rivals { display: grid; gap: 8px; }
.rv-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 12px; }
.rv-row.me { background: #FFF2C6; border: 2px dashed var(--yellow-d); }
.rv-row .pl { font-size: 20px; width: 26px; text-align: center; }
.rv-row .logo { width: 32px; height: 32px; font-size: 18px; border-width: 2px; border-radius: 10px; }
.rv-row .grow { flex: 1; min-width: 0; display: grid; gap: 3px; }
.rv-row .grow b { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-bar { height: 8px; border-radius: 99px; background: var(--paper-2); overflow: hidden; border: 2px solid var(--line); display: block; }
.rv-bar i { display: block; height: 100%; border-radius: 99px; transition: width .6s; }
.rv-row .num { font-size: 13px; }
.cups { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-family: var(--display); font-weight: 600; font-size: 20px; }

/* ---------- VIP ---------- */
.vip-card { display: flex; align-items: center; gap: 12px; width: 100%; background: linear-gradient(120deg, #FFE27A, #FFC93C 45%, #FFB0D4); }
.vip-head { text-align: center; padding: 18px 0 8px; }
.vip-head .crown { font-size: 64px; animation: bob 2s ease-in-out infinite; }
.vip-head h2 { font-size: 28px; }
.perks { display: grid; gap: 8px; margin: 12px 0 14px; }
.perk { display: flex; align-items: center; gap: 10px; background: #FFF8DD; border: 2px solid var(--line); border-radius: 14px; padding: 8px 12px; text-align: left; }
.perk .e { font-size: 26px; }
.perk span:nth-child(2) { flex: 1; }
.perk b { display: block; }
.perk small { font-size: 12px; color: var(--ink-2); }
.pick { position: relative; }
.pick.locked { background: #F3F0FF; }
.pick.locked .e, .pick.locked b { opacity: .6; }
.vip-tag { position: absolute; top: -9px; right: -6px; font-size: 11px; font-family: var(--display); font-weight: 600; background: var(--yellow); border: 2px solid var(--line); border-radius: 99px; padding: 1px 7px; transform: rotate(6deg); }
.logo-grid button.locked { background: linear-gradient(135deg, #FFE27A, #FFB0D4); }

/* ---------- celebrations overlay ---------- */
.overlay { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(43, 34, 80, .7); animation: fade .25s; }
.ov-card { position: relative; width: min(380px, 100%); background: #fff; border: 4px solid var(--line); border-radius: 28px; box-shadow: 0 8px 0 var(--ink); padding: 26px 18px 18px; text-align: center; overflow: hidden; animation: pop .5s cubic-bezier(.2, 1.4, .4, 1); }
.ov-card > * { position: relative; }
.ov-card .burst { position: absolute; inset: -50%; background: repeating-conic-gradient(from 0deg, rgba(255, 201, 60, .35) 0deg 12deg, transparent 12deg 24deg); animation: rays 8s linear infinite; }
@keyframes rays { to { transform: rotate(360deg); } }
.ov-e { font-size: 84px; line-height: 1; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1), bob 2s 0.6s ease-in-out infinite; }

.rank-big { font-family: var(--display); font-weight: 700; font-size: 26px; background: var(--yellow); border: 3px solid var(--ink); border-radius: 16px; padding: 6px 12px; display: inline-block; margin: 4px 0 8px; }
.cup-board { display: grid; gap: 6px; margin: 8px 0 12px; text-align: left; }
.cup-board div { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 12px; background: var(--paper-2); }
.cup-board div span:nth-child(2) { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cup-board .me { background: #FFF2C6; border: 2px solid var(--yellow-d); }

/* ---------- week transition ---------- */
.week-flip { position: fixed; inset: 0; z-index: 70; display: grid; place-content: center; justify-items: center; gap: 10px; background: rgba(43, 34, 80, .45); animation: fade .15s; pointer-events: none; }
.cal-big { width: 170px; background: #fff; border: 4px solid var(--ink); border-radius: 24px; box-shadow: 0 8px 0 var(--ink); overflow: hidden; text-align: center; animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
.cal-top { background: var(--red); color: #fff; font-family: var(--display); font-weight: 700; letter-spacing: .15em; padding: 6px; border-bottom: 4px solid var(--ink); }
.cal-num { font-family: var(--display); font-weight: 700; font-size: 72px; line-height: 1.1; }
.cal-num.flip { animation: page-flip .4s ease-out; color: var(--green-d); }
@keyframes page-flip { from { transform: perspective(300px) rotateX(90deg); opacity: 0; } }
.cal-days { display: flex; justify-content: center; gap: 3px; padding: 0 6px 10px; }
.cal-days span { font-size: 9px; font-weight: 800; background: var(--paper-2); border-radius: 6px; padding: 2px 3px; animation: day-tick .2s backwards; }
@keyframes day-tick { from { background: var(--yellow); transform: scale(1.3); } }
.flip-coins { font-size: 30px; animation: rise .9s ease-out forwards; }

/* flying coins */
.coin-fly { position: fixed; z-index: 75; font-size: 28px; pointer-events: none; animation: coin-fly 1.2s cubic-bezier(.2, .7, .3, 1) forwards; }
@keyframes coin-fly { 40% { transform: translate(calc(var(--dx) * .5), -30vh) rotate(180deg); } 100% { transform: translate(var(--dx), -60vh) rotate(360deg) scale(.6); opacity: 0; } }

/* chat typing dots */
.typing { display: inline-flex; gap: 4px; background: #fff; border: 2px solid var(--line); border-radius: 16px; padding: 8px 12px; margin: 6px 0; animation: typing-out 0s forwards; }
.typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: dot 1s infinite; }
.typing span:nth-child(2) { animation-delay: .15s; } .typing span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-4px); background: var(--ink); } }
@keyframes typing-out { to { display: none; opacity: 0; height: 0; padding: 0; margin: 0; border: 0; } }

/* review stars pop in */
.stars span { display: inline-block; animation: pop .35s ease-out backwards; }
.stars .off { color: #E5E1F5; }

.big-face { width: 72px !important; height: 72px !important; font-size: 42px !important; }
.mission.done { background: #FFF8DD; border-radius: 12px; }
.title-foot { display: flex; justify-content: center; }
.boxes { grid-template-columns: repeat(4, 1fr); }
.box { font-size: 40px; }
.moves { grid-template-columns: repeat(2, 1fr); }

@media (max-width: 380px) {
  .powers { grid-template-columns: repeat(2, 1fr); }
  .boxes { grid-template-columns: repeat(2, 1fr); }
}

<script>
// Shared helpers. Every game file hangs off the global CS namespace so the
// game runs from a plain file:// double-click as well as from a web server.
var CS = globalThis.CS = globalThis.CS || {};

(function () {
  // Seedable random numbers (mulberry32) so the Daily Challenge gives everyone the same start.
  var s = (Math.random() * 4294967296) >>> 0;
  function random() {
    s = (s + 0x6D2B79F5) >>> 0;
    var t = s;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  CS.U = {
    random: random,
    seed: function (n) { s = n >>> 0; },
    state: function () { return s; },
    hash: function (str) {
      var h = 2166136261;
      for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return h >>> 0;
    },
    rand: function (a, b) { return a + random() * (b - a); },
    ri: function (a, b) { return Math.floor(a + random() * (b - a + 1)); },
    chance: function (p) { return random() < p; },
    pick: function (arr) { return arr[Math.floor(random() * arr.length)]; },
    clamp: function (v, a, b) { return Math.max(a, Math.min(b, v)); },
    shuffle: function (arr) {
      var a = arr.slice();
      for (var i = a.length - 1; i > 0; i--) {
        var j = Math.floor(random() * (i + 1));
        var t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
    // Pick one item using weightFn(item) >= 0. Returns null when all weights are 0.
    weighted: function (items, weightFn) {
      var total = 0, ws = items.map(function (it) { var w = Math.max(0, weightFn(it) || 0); total += w; return w; });
      if (total <= 0) return null;
      var r = random() * total;
      for (var i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0 && ws[i] > 0) return items[i]; }
      for (var j = items.length - 1; j >= 0; j--) if (ws[j] > 0) return items[j];
      return null;
    },
    // Round to two significant figures so prices read like real prices.
    nice: function (n) {
      if (!isFinite(n) || n <= 0) return 0;
      if (n < 100) return Math.round(n);
      var p = Math.pow(10, Math.floor(Math.log10(n)) - 1);
      return Math.round(n / p) * p;
    },
    money: function (n) {
      n = Math.round(n || 0);
      var sg = n < 0 ? '-' : '', a = Math.abs(n);
      if (a >= 1e12) return sg + '$' + (a / 1e12).toFixed(2) + 'T';
      if (a >= 1e9) return sg + '$' + (a / 1e9).toFixed(2) + 'B';
      if (a >= 1e7) return sg + '$' + (a / 1e6).toFixed(2) + 'M';
      return sg + '$' + a.toLocaleString('en-US');
    },
    short: function (n) {
      n = Math.round(n || 0);
      var sg = n < 0 ? '-' : '', a = Math.abs(n);
      if (a >= 1e12) return sg + '$' + (a / 1e12).toFixed(1) + 'T';
      if (a >= 1e9) return sg + '$' + (a / 1e9).toFixed(1) + 'B';
      if (a >= 1e6) return sg + '$' + (a / 1e6).toFixed(1) + 'M';
      if (a >= 1e4) return sg + '$' + Math.round(a / 1e3) + 'K';
      return sg + '$' + a.toLocaleString('en-US');
    },
    num: function (n) {
      n = Math.round(n || 0);
      var a = Math.abs(n);
      if (a >= 1e9) return (n / 1e9).toFixed(1) + 'B';
      if (a >= 1e6) return (n / 1e6).toFixed(1) + 'M';
      if (a >= 1e4) return (n / 1e3).toFixed(1) + 'K';
      return n.toLocaleString('en-US');
    },
    signed: function (n) { return (n >= 0 ? '+' : '') + CS.U.money(n); },
    // Base64 that is safe in links and supports emoji (used for war codes).
    b64enc: function (str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
    b64dec: function (str) { str = str.replace(/-/g, '+').replace(/_/g, '/'); while (str.length % 4) str += '='; return decodeURIComponent(escape(atob(str))); },
    // coach -> coaches, baker -> bakers
    plural: function (w) { return /(s|sh|ch|x|z)$/i.test(w) ? w + 'es' : w + 's'; },
    esc: function (str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    },
    today: function () {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
  };
})();

      mods: [], rel: {}, dating: {}, cooldowns: {}, flags: { equip: 1 }, formers: [], upgrades: {},
      xp: 0, level: 1, missions: [], streak: 0, bestStreak: 0, posted: false, rank: 0,
      stats: { decisions: 0, fired: 0, revenue: 0, peakCash: 0, fullStreak: 0, maxStaff: 0, bigWeeks: 0, hires: 0, posts: 0,
        upgrades: 0, weeksPlayed: 0, minigames: 0, ads: 0, missionsDone: 0, quizRight: 0, vsWins: 0, virals: 0, powers: 0, golden: 0 },

    };
    if (G.has(e, 'reliable')) e.reliability = Math.min(99, e.reliability + 15);
    if (G.has(e, 'unreliable')) e.reliability -= 30;

    if (G.has(e, 'greedy')) ask *= 1.15;

  };

  G.has = function (e, t) { return e.traits.indexOf(t) >= 0; };
  G.emp = function (g, id) { for (var i = 0; i < g.employees.length; i++) if (g.employees[i].id === id) return g.employees[i]; return null; };
  G.traitKnown = function (e, i) { return i === 0 || e.weeks >= 4 || e.revealed; };

  G.productivity = function (e) {
