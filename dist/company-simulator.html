<script>
// All events, part 1: team, business and customers. The rest live in events-more.js, events-fun.js, events-life.js
// and the events-biz*.js files (events for one kind of business).
// Every event that asks the player something has exactly 4 responses.
//
// Common fields:
//   id, cat (see CS.CATS), icon, kind, rarity (common|rare|epic|legendary), w (weight), cd (cooldown weeks),
//   minWeek, need (min staff), cond(g), who ({a: 'any'|'<trait>'|'front'|'mgr'|'lowmood'|'star'|'new'|'veteran'|'notmgr'|'old', b: ...}),
//   init(g, ctx) to add data (return false to skip), start (effect applied when the event appears),
//   chainOnly (only happens as a follow-up).
// Text uses {a} {b} {m} {rival} {amt} {company} {front} {fronts} {unit} {industry} {city} and any ctx key.
//
// Kinds:
//   choice (default)  title, text, choices: [4 x { t, d, fx }]
//   chat              from: 'a' | 'm' | { name, face }, msgs: [...], choices = replies
//   review            stars, text, choices
//   news              title = headline, text, choices
//   boxes             prizes: [{ label, emoji, w, fx }]   (player picks 1 of 4 boxes)
//   wheel             slices: [{ label, emoji, color, w, fx, jackpot, bad }]   (spin, golden spin, sure prize, skip)
//   tap               target (emoji), goal, secs, win, lose   (easy, normal, hard, skip)
//   quiz              init makes ctx.q = { q, options (4), answer }, win, lose
//   deal              init sets ctx.offer, accept(g, c) -> fx   (accept, push, push hard, walk away)
//   vs                win, lose, tie   (4 moves)
//   interview         init makes ctx.cand   (4 questions, then 4 ways to hire or pass)
//   post              pick 1 of 4 social media posts
//
// Effect (fx) keys: cash (share of weekly sales, negative = cost), money ($), rep, happy, fans, team,
//   a/b/m (mood of that person), skill/loyal/reliable ({a: n}), rel ['a','b',n], date, breakup,
//   raise ['a', pct], teamRaise, teamBonus, bonus 'a', promote 'a', mgr 'a', demote 'a', fire 'a', quit 'a', die 'a',
//   demand/capacity/supply [value, weeks, label], extra [share, weeks, label], closed [weeks, label],
//   price (+1/-1), equip (permanent speed), rent (permanent), viral [min, max], hire 'cand', hireSpecial {...},
//   pet (emoji), rival (+/- share of that rival's strength), next ['id', minWeeks, maxWeeks, chance],
//   chance { p, win, lose }, say, xp, flag, run(g, c).
var CS = globalThis.CS = globalThis.CS || {};

(function () {
  var U = CS.U, G = CS.G;
  CS.EVENTS = [];
  CS.EV = {};
  CS.ev = function (d) {
    d.kind = d.kind || (d.choices ? 'choice' : 'minor');
    CS.EVENTS.push(d);
    CS.EV[d.id] = d;
  };
  var ev = CS.ev;

  // Shared helpers for writing events (also used by the other event files).
  var H = CS.EVH = {
    rival: function (g, c) { c.rival = U.pick(g.rivals); },
    amt: function (frac) { return function (g, c) { c.amt = G.cost(g, frac); }; },
    tag: function (t) { return function (g) { return CS.hasTag(g.company.industry, t); }; },
    noCams: function (g) { return !G.upLevel(g, 'cameras'); },
    hasRole: function (r) { return function (g) { return g.employees.some(function (e) { return e.role === r; }); }; },
    season: function (from, to) { return function (g) { var w = ((g.week - 1) % 52) + 1; return w >= from && w <= to; }; },
    busy: function (g) { var h = g.history[g.history.length - 1]; return h && h.demand > h.capacity * 1.08; },
    isInd: function (id) { return function (g) { return g.company.industry === id; }; }
  };
  var rival = H.rival, amt = H.amt, noCams = H.noCams, season = H.season, busy = H.busy;
  var FOOD = H.tag('food'), TECH = H.tag('tech');

  // =====================================================================
  // 👥 TEAM
  // =====================================================================

  ev({ id: 'fight', cat: 'team', icon: '🥊', w: 4, cd: 5, need: 2, who: { a: 'aggressive', b: 'any' },
    title: '{a} and {b} had a big fight!',
    text: 'They yelled at each other in front of customers. 😤 Now they won\'t talk.',
    choices: [
      { t: '🤝 Help them make up', fx: { chance: { p: 0.6, win: { rel: ['a', 'b', 35], team: 2, say: 'They shook hands! 🤗' }, lose: { rel: ['a', 'b', -10], say: 'It didn\'t work. {b} is still angry.', next: ['feud', 1, 2] } } } },
      { t: '🪶 Settle it with a pillow fight', fx: { team: 6, rel: ['a', 'b', 20], say: 'Feathers EVERYWHERE. They laughed so hard they forgot the fight. 🪶😂' } },
      { t: '🚪 Fire {a}', fx: { fire: 'a', say: 'Everyone got the message. No fighting!' } },
      { t: '🙈 Ignore it', fx: { rel: ['a', 'b', -30], next: ['feud', 1, 1], say: 'You hope it goes away...' } }
    ] });

  ev({ id: 'feud', cat: 'team', icon: '🔥', chainOnly: true,
    title: 'The fight got WORSE!',
    text: '{a} and {b} are still fighting. Now the whole team is picking sides. {b} says: "Me or them!"',
    choices: [
      { t: '💵 Give {b} a raise to stay', fx: { raise: ['b', 0.1], a: -6, say: '{b} stays. {a} is jealous.' } },
      { t: '🚪 Fire {a}', fx: { fire: 'a', team: 3, say: 'Peace at last! 😌' } },
      { t: '🏕️ Send them on a camping trip together', fx: { cash: -0.2, chance: { p: 0.6, win: { rel: ['a', 'b', 60], say: 'They got lost in the woods together and came back best friends! 🏕️' }, lose: { rel: ['a', 'b', -20], say: 'They argued about the tent all night. ⛺😤' } } } },
      { t: '👋 Let {b} leave', fx: { quit: 'b', say: '{b} packed up and left.' } }
    ] });

  ev({ id: 'joined_rival', cat: 'rivals', icon: '🕵️', kind: 'news', chainOnly: true,
    title: '{name} now works for {rival}!',
    text: 'Your old worker {name} joined your rival {rival}. They know all your secrets! 😱',
    choices: [
      { t: '📞 Ask {name} to come back', fx: { chance: { p: 0.35, win: { hireSpecial: { role: 'front', skill: 70 }, say: 'They came back! "It was SO boring over there." 😅' }, lose: { say: 'They say they\'re happy there. Hmm.', next: ['idea_stolen', 3, 6, 0.5] } } } },
      { t: '🔐 Change all the secret recipes', fx: { cash: -0.2, say: 'New secrets! Nothing they know works now. 🔐' } },
      { t: '💐 Send a "good luck" gift', fx: { rep: 2, next: ['idea_stolen', 4, 8, 0.25], say: 'Classy move. People noticed. ✨' } },
      { t: '🤷 Whatever', fx: { rival: 0.05, next: ['idea_stolen', 3, 6, 0.6], say: 'You move on. {rival} looks happy though... 😬' } }
    ] });

  ev({ id: 'idea_stolen', cat: 'rivals', icon: '💡', kind: 'news', chainOnly: true,
    title: '{rival} stole your idea!',
    text: '{rival} launched a new product. It was {name}\'s idea when they worked for YOU! Customers are going there.',
    choices: [
      { t: '⚖️ Sue them', fx: { cash: -1.5, chance: { p: 0.5, win: { cash: 4, rep: 3, rival: -0.15, say: 'You WON in court! 🎉' }, lose: { demand: [0.9, 4, 'Rival copied you'], say: 'You lost the case. 😩' } } } },
      { t: '🚀 Make a better version', fx: { cash: -0.8, fans: 12, rival: -0.05, say: 'Yours is better! Customers noticed. 😎' } },
      { t: '😂 Post "Copying is a compliment"', fx: { fans: 15, rep: 2, say: 'Everyone laughed at {rival}. Savage but classy. 🔥' } },
      { t: '🤷 Let it go', fx: { demand: [0.88, 5, 'Rival copied you'], rival: 0.08, say: 'Some customers go to {rival} for a while.' } }
    ] });

  ev({ id: 'late', cat: 'team', icon: '⏰', kind: 'chat', w: 3, who: { a: 'unreliable' }, from: 'a',
    title: '{a} is late again',
    msgs: ['sorry boss 😬', 'overslept AGAIN', 'be there in 20 min!!'],
    choices: [
      { t: '💬 "Is everything okay?"', fx: { chance: { p: 0.5, win: { loyal: { a: 15 }, reliable: { a: 12 }, say: '{a} had problems at home. They promise to do better. ❤️' }, lose: { say: '{a} says thanks... and is late again on Friday. 🙄' } } } },
      { t: '⏰ "I\'m buying you 5 alarm clocks"', fx: { money: -60, reliable: { a: 20 }, a: 4, say: 'RING RING RING RING RING. {a} is never late again. 😂' } },
      { t: '⚠️ "Last warning!"', fx: { reliable: { a: 12 }, a: -10, say: '{a} is on time now. Not happy about it though.' } },
      { t: '🚪 "You\'re fired."', fx: { fire: 'a', say: 'Bye {a}! 👋' } }
    ] });

  ev({ id: 'raise_request', cat: 'team', icon: '💵', kind: 'chat', w: 4, who: { a: 'greedy' }, from: 'a',
    title: '{a} wants more money',
    msgs: ['hey boss 👋', 'can I get a raise?', 'I work really hard 💪'],
    choices: [
      { t: '💵 "Sure! +10%"', fx: { raise: ['a', 0.1], say: '{a} is super happy! 😁' } },
      { t: '🤏 "I can do +5%"', fx: { raise: ['a', 0.05], say: '{a} takes it.' } },
      { t: '📅 "Ask me in 2 months"', fx: { next: ['raise_promise', 8, 8], say: '{a} will remember that...' } },
      { t: '❌ "No."', fx: { a: -15, loyal: { a: -10 }, next: ['resign', 2, 5, 0.4], say: '{a} is sad. 😞 They might look for a new job.' } }
    ] });

  ev({ id: 'raise_promise', cat: 'team', icon: '📅', kind: 'chat', chainOnly: true, from: 'a',
    title: '{a} remembers your promise',
    msgs: ['hey boss', 'it\'s been 2 months 👀', 'what about my raise?'],
    choices: [
      { t: '✅ "A promise is a promise!"', fx: { raise: ['a', 0.1], loyal: { a: 15 }, say: '{a} trusts you now. 🙌' } },

  function quizGen() {
    var t = U.ri(0, 4), q, ans, opts, money = true;
    if (t === 0) {
      var price = U.ri(3, 15), paid = price <= 5 ? 10 : 20; ans = paid - price;
      q = 'A customer buys something for $' + price + '. They pay with $' + paid + '. How much change do you give back?';
      opts = [ans, ans + 1, ans + 2, ans - 1, ans + 3];
    } else if (t === 1) {
      var n = U.ri(2, 9), p = U.ri(2, 6); ans = n * p;
      q = 'You sell ' + n + ' things for $' + p + ' each. How much money did you make?';
      opts = [ans, ans + p, ans - p, n + p, ans + 2 * p];
    } else if (t === 2) {
      var sell = U.ri(8, 20), costx = U.ri(2, sell - 2); ans = sell - costx;
      q = 'You sell a toy for $' + sell + '. It cost you $' + costx + ' to make. How much PROFIT did you make?';
      opts = [ans, sell + costx, ans + 2, ans - 2, ans + 1];
    } else if (t === 3) {
      var full = U.pick([10, 20, 40, 50, 100]), pct = U.pick([10, 20, 50]); ans = full - full * pct / 100;
      q = 'Something costs $' + full + '. It\'s ' + pct + '% off today! What is the new price?';
      opts = [ans, full - pct, full * pct / 100, ans + 5, ans - 5];
    } else {
      var w = U.ri(2, 6), each = U.pick([5, 10, 20, 25]); ans = w * each; money = false;
      q = 'You have ' + w + ' workers. Each one helps ' + each + ' customers a day. How many customers get help in one day?';
      opts = [ans, w + each, ans + each, ans - each, ans + 2 * each];
    }
    var uniq = [];
    opts.forEach(function (o) { if (uniq.indexOf(o) < 0 && o > 0) uniq.push(o); });
    for (var k = 1; uniq.length < 4; k++) if (uniq.indexOf(ans + k * 4) < 0) uniq.push(ans + k * 4);
    uniq = U.shuffle(uniq.slice(0, 4));
    return { q: q, options: uniq.map(function (o) { return (money ? '$' : '') + o; }), answer: uniq.indexOf(ans) };
  }

// Background music: a cheerful chiptune loop made live with Web Audio, so there are no song files

var CS = globalThis.CS = globalThis.CS || {};

CS.Music = (function () {
  var ctx = null, master = null, noise = null, timer = null, playing = false;
  var step = 0, nextTime = 0;
  var BPM = 118, STEP = 60 / BPM / 4; // sixteenth notes

  var MELODY = [
    [72, 0, 76, 0, 79, 0, 76, 0, 77, 0, 76, 0, 74, 0, 0, 0],
    [72, 0, 69, 0, 72, 0, 76, 0, 74, 0, 72, 0, 69, 0, 0, 0],
    [69, 0, 72, 0, 77, 0, 76, 0, 74, 0, 72, 0, 74, 0, 76, 0],
    [74, 0, 0, 0, 71, 0, 74, 0, 79, 0, 0, 0, 77, 76, 74, 0],
    [77, 0, 76, 0, 74, 0, 72, 0, 74, 0, 76, 0, 77, 0, 79, 0],
    [79, 0, 77, 0, 76, 0, 74, 0, 71, 0, 74, 0, 79, 0, 0, 0],
    [76, 0, 79, 0, 84, 0, 79, 0, 76, 0, 74, 0, 71, 0, 0, 0],
    [72, 0, 74, 0, 76, 0, 74, 0, 72, 0, 0, 0, 79, 77, 76, 74]

    var d = noise.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }

  function tone(freq, t, dur, type, vol) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

    } else if (has('tech') || has('media')) { // satellite dish

      x.restore();

      x.strokeStyle = INK; x.lineWidth = 2; x.beginPath(); x.moveTo(px - 18, base); x.lineTo(px - 18, base - 30); x.lineTo(px + 18, base - 30); x.lineTo(px + 18, base); x.stroke();
      ['#FF5FA2', '#2EA8FF', '#FFC93C', '#22C55E'].forEach(function (col, i) {

    } else { // bench and flowers
      x.fillStyle = '#C98B55'; rr(x, px - 18, base - 13, 36, 4, 2); x.fill(); ink(x, 1.2); rr(x, px - 18, base - 20, 36, 4, 2); x.fill(); ink(x, 1.2);
      x.fillStyle = INK; x.fillRect(px - 15, base - 9, 2.5, 9); x.fillRect(px + 12.5, base - 9, 2.5, 9);
      ['#FF5FA2', '#FFC93C', '#7C4DFF'].forEach(function (col, i) { circle(x, px - 26 + i * 4, base - 5 - (i % 2) * 3, 2.6); x.fillStyle = col; x.fill(); });
    }
  }

  // ---------- people ----------

  function newLook(kid) {
    return { skin: pick(SKINS), hair: pick(HAIRS), style: Math.floor(Math.random() * 5), shirt: pick(SHIRTS), pants: pick(PANTS), kid: kid,
      balloon: kid && Math.random() < 0.5 ? pick(['#FF4D5E', '#FFC93C', '#2EA8FF', '#FF5FA2']) : null, dog: !kid && Math.random() < 0.08 };
  }

  // Draws a cartoon person with their feet at (px, py). dir: 1 = facing right, -1 = left.
  function person(x, P, px, py, dir, phase, moving, gold) {
    var s = P.kid ? 0.78 : 1, sw = moving ? Math.sin(phase) : 0, headY = -27.5;
    x.save(); x.translate(px, py); x.scale(dir * s, s);

    if (P.balloon) {

      circle(x, 6, -50, 6); x.fillStyle = P.balloon; x.fill(); ink(x, 1.4);
    }

    // Legs and shoes

    x.beginPath(); x.moveTo(2, -10); x.lineTo(2 - sw * 4, -0.5); x.stroke();
    x.fillStyle = INK; circle(x, -2 + sw * 4 + 1, 0, 1.9); x.fill(); circle(x, 2 - sw * 4 + 1, 0, 1.9); x.fill();

    x.beginPath(); x.moveTo(-1, -19); x.lineTo(-1 - sw * 4.5, -11.5); x.stroke();

    // Front arm, with a shopping bag if they bought something
    x.strokeStyle = gold ? '#FFD23F' : P.shirt; x.lineWidth = 3;
    x.beginPath(); x.moveTo(1, -19); x.lineTo(1 + sw * 4.5, -11.5); x.stroke();
    circle(x, 1 + sw * 4.5, -11, 1.8); x.fillStyle = P.skin; x.fill();
    if (P.bag) { rr(x, 1 + sw * 4.5 - 3, -11, 7, 8, 1.5); x.fillStyle = P.bag; x.fill(); ink(x, 1.1); }
    // Head and hair

    x.fillStyle = P.hair;

    } else if (P.style !== 4) {
      x.beginPath(); x.arc(0, headY - 1, 6.9, Math.PI * 1.02, Math.PI * 1.98); x.fill();
      if (P.style === 2) { circle(x, -4, headY - 7, 3); x.fill(); }
    }
    if (gold) { // crown
      x.fillStyle = '#FFC93C'; x.beginPath(); x.moveTo(-5, headY - 6); x.lineTo(-5, headY - 12); x.lineTo(-2.5, headY - 8.5); x.lineTo(0, headY - 13); x.lineTo(2.5, headY - 8.5); x.lineTo(5, headY - 12); x.lineTo(5, headY - 6); x.closePath(); x.fill(); ink(x, 1.1);
    }
    x.fillStyle = INK; circle(x, 1.8, headY + 0.2, 0.95); x.fill(); circle(x, 4.4, headY + 0.2, 0.95); x.fill();
    x.strokeStyle = INK; x.lineWidth = 1; x.beginPath(); x.arc(3.2, headY + 2.2, 1.8, 0.15, Math.PI - 0.4); x.stroke();
    x.fillStyle = 'rgba(255,120,140,.45)'; circle(x, 5.2, headY + 2.3, 1.3); x.fill();
    x.restore();
    if (P.dog) emoji(x, '🐕', px - dir * 14, py - 5 - Math.abs(Math.sin(phase)) * 1.5, 12);
  }
  function bubble(x, px, py, e, a) {
    x.globalAlpha = Math.max(0, Math.min(1, a));
    rr(x, px - 10, py - 20, 20, 16, 7); x.fillStyle = '#FFFFFF'; x.fill(); ink(x, 1.3);

  // ---------- cars ----------

  function car(x, c, L, tod) {
    var y = c.lane ? L.ground + 44 : L.ground + 31, px = c.x;
    x.save(); x.translate(px, y); x.scale(c.dir, 1);
    if (tod !== 'day') { var gl = x.createLinearGradient(16, 0, 60, 0); gl.addColorStop(0, 'rgba(255,240,170,.5)'); gl.addColorStop(1, 'rgba(255,240,170,0)'); x.fillStyle = gl; x.beginPath(); x.moveTo(17, -8); x.lineTo(60, -14); x.lineTo(60, 2); x.closePath(); x.fill(); }

      rr(x, 10, -16, 8, 6, 2); x.fillStyle = '#CFEFFF'; x.fill(); ink(x, 1);

  // ---------- main loop ----------

  function draw(t) {

    });
    S.birds = S.birds.filter(function (bd) { return bd.x < W + 20; });

    drawSkyline(x, L, tod, wx);
    // Grass strip behind the sidewalk

    if (L.gap > 110) tree(x, L.rx - 16, L, sec, sea, wx);

    drawRival(x, L, g, tod, wx);
    drawBuilding(x, L, g, tod, wx, sec, closed);

    x.fillStyle = wx === 'snow' ? '#F1F3FA' : '#E9E4F5'; x.fillRect(0, L.ground, W, 15);
    x.fillStyle = '#D3CCE8'; for (var p = 0; p < W; p += 24) x.fillRect(p, L.ground, 1.5, 15);
    x.fillStyle = '#B8AFD6'; x.fillRect(0, L.ground + 15, W, 3);
    x.fillStyle = wx === 'rain' ? '#3E3D5C' : '#4B4A6B'; x.fillRect(0, L.ground + 18, W, H - L.ground - 18);
    x.fillStyle = 'rgba(255,255,255,.75)'; for (var l = 6; l < W; l += 34) x.fillRect(l, L.ground + 32.5, 16, 2.5);

    if (!S.queue || S.queue.length !== waiting) { S.queue = []; for (var qi = 0; qi < waiting; qi++) S.queue.push(newLook(Math.random() < 0.2)); }

    if (waiting >= 3) bubble(x, L.door + 20 + (waiting - 1) * 14, L.walkY - 36, '😤', 0.6 + Math.sin(sec * 2) * 0.4);

    }

      S.door = 0.5;

    });
    S.walkers.forEach(function (w) {
      var goal = w.target === 'shop' ? L.door : w.target === 'rival' ? L.rdoor : null;

        if (w.target === 'shop') { S.door = 0.6; S.floaters.push({ x: goal, y: L.ground - 44, txt: pick(['+$', '+$$', '💰', '+⭐']), a: 1 }); S.exits.push({ at: t + rnd(1800, 4200) }); }
        else { S.rivalDoor = 0.6; S.floaters.push({ x: goal, y: L.ground - 34, txt: '😒', a: 0.9, big: true }); }
      }
      if (w.going) { w.a -= dt * 3; w.shrink = true; }
      else {

      if (golden.x < 24) golden.dir = 1;
      if (!golden.P) golden.P = { skin: '#FFE3CC', hair: '#E6B94A', style: 0, shirt: '#FFD23F', pants: '#B8860B', kid: false };
      x.save(); x.shadowColor = '#FFD700'; x.shadowBlur = 14 + Math.sin(sec * 6) * 6;
      person(x, golden.P, golden.x, L.walkY, golden.dir, golden.phase, true, true);
      x.restore();
      emoji(x, '✨', golden.x + 12, L.walkY - 38 + Math.sin(sec * 7) * 3, 11);
      emoji(x, '💰', golden.x - 12, L.walkY - 30 + Math.cos(sec * 6) * 3, 10);
      golden.y = L.walkY - 16;
    }

    // Cars
    if (t - S.lastCar > 2600 && Math.random() < 0.03) {

      S.cars.push({ x: cdir > 0 ? -40 : W + 40, dir: cdir, lane: lane, v: rnd(55, 85), color: van ? g.company.color : pick(CARS), van: van, logo: g.company.logo });
    }

      }

        if (wx === 'rain') { x.strokeStyle = 'rgba(200,220,255,.75)'; x.lineWidth = 1.3; x.beginPath(); x.moveTo(f.x, f.y); x.lineTo(f.x - 2, f.y + 8); x.stroke(); }
        else if (wx === 'snow') { f.x += Math.sin(sec + f.y / 20) * 0.35; x.fillStyle = '#FFFFFF'; circle(x, f.x, f.y, 2.3); x.fill(); }
        else { f.x += Math.sin(sec * 2 + f.r) * 0.6; f.r += dt * 3; x.save(); x.translate(f.x, f.y); x.rotate(f.r); x.fillStyle = f.c; x.beginPath(); x.ellipse(0, 0, 4, 2.2, 0, 0, Math.PI * 2); x.fill(); x.restore(); }
      });
      S.parts = S.parts.filter(function (f) { return f.y < (wx === 'rain' ? L.ground + 10 : L.ground + 12); });
      if (wx === 'rain') { x.fillStyle = 'rgba(40,40,90,.08)'; x.fillRect(0, 0, W, H); }
    } else S.parts = [];

  }

  }

    start: start,
    onGolden: function (f) { onGolden = f; },
    burst: function (txt) { var cv = canvas(); if (cv) S.floaters.push({ x: cv.clientWidth * 0.36, y: 70, txt: txt, a: 1.4, big: true }); },
    debug: debug

})();

  function wheelSvg(def) {
    var n = def.slices.length, a = 360 / n, r = 96, parts = '';
    function pt(deg, rad) { var t = deg * Math.PI / 180; return (rad * Math.sin(t)).toFixed(2) + ' ' + (-rad * Math.cos(t)).toFixed(2); }
    def.slices.forEach(function (s, i) {
      parts += '<path d="M0 0 L' + pt(i * a, r) + ' A' + r + ' ' + r + ' 0 0 1 ' + pt((i + 1) * a, r) + ' Z" fill="' + s.color + '" stroke="#2B2250" stroke-width="3"/>';
      var mid = (i + 0.5) * a, p = pt(mid, 64).split(' ');
      parts += '<text x="' + p[0] + '" y="' + p[1] + '" font-size="22" text-anchor="middle" dominant-baseline="central" transform="rotate(' + mid + ' ' + p[0] + ' ' + p[1] + ')">' + s.emoji + '</text>';
    });
    return '<div class="wheel-wrap"><span class="wheel-pointer">🔻</span><svg id="wheel" viewBox="-100 -100 200 200" role="img" aria-label="Prize wheel"><circle r="99" fill="#2B2250"/>' + parts + '</svg><div class="wheel-hub">🍀</div></div>';
  }

  function render() {
    var g = S.g;
    if (S.screen === 'game' && g && g.over && !S.sheet) { S.screen = 'over'; }
    $app.innerHTML = S.screen === 'title' ? titleScreen() : S.screen === 'create' ? createScreen() : S.screen === 'over' ? overScreen() : gameScreen();
    // Tab content animates in only when you open a new screen or tab.
    var view = S.screen + ':' + S.tab;
    var tv = $app.querySelector('.tabview');
    if (tv && view !== S.viewKey) tv.classList.add('enter');
    S.viewKey = view;
    renderSheet();
    if (S.screen === 'game' && S.tab === 'home') CS.Scene.start();
    if (g && S.screen === 'game') S.prev = G.snap(g);
  }

  function renderSheet() {

  // After-render work: number count-ups and the share image.
  function hydrate() {
    document.querySelectorAll('[data-count]').forEach(function (el) {
      var to = +el.dataset.count, from = +(el.dataset.from || 0), fmt = el.dataset.fmt, t0 = performance.now(), dur = 700;
      if (reduced) { el.textContent = fmtVal(to, fmt); return; }
      (function step(t) {
        var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmtVal(Math.round(from + (to - from) * e), fmt);
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    });
    var img = document.getElementById('shareImg');
    if (img && !img.src) img.src = shareCard();
  }

  function spinWheel(mode) {
    var sh = S.sheet, def = CS.EV[sh.x.id];

    render();
    var n = def.slices.length, a = 360 / n, target = 360 * 6 - (sh.res.slice + 0.5) * a + (Math.random() - 0.5) * a * 0.5;
    var el = document.getElementById('wheel');
    SFX.play('whoosh');
    requestAnimationFrame(function () { requestAnimationFrame(function () { if (el) el.style.transform = 'rotate(' + target + 'deg)'; }); });
    var ticks = 0, tk = setInterval(function () { if (++ticks > 16) clearInterval(tk); else SFX.play('tick'); }, 180);
    setTimeout(function () { if (S.sheet === sh) { sh.phase = 'result'; celebrate(sh.res); render(); } }, 3600);
  }

  function startTap() {
    var sh = S.sheet, def = CS.EV[sh.x.id], arena = document.getElementById('arena'), goal = G.tapGoal(def, sh.level);
    if (!arena || tapState) return;
    arena.querySelector('.start').remove();
    var btn = document.createElement('button');
    btn.className = 'target'; btn.type = 'button'; btn.textContent = def.target; btn.setAttribute('aria-label', 'Tap');
    arena.appendChild(btn);
    tapState = { n: 0, end: performance.now() + def.secs * 1000 };
    var speed = [1100, 850, 650][sh.level];
    function move() {
      var w = arena.clientWidth - 72, h = arena.clientHeight - 72 - 30;
      btn.style.left = Math.round(Math.random() * w) + 'px';
      btn.style.top = Math.round(30 + Math.random() * h) + 'px';
    }
    move();
    var mover = setInterval(move, speed);
    btn.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      if (!tapState) return;
      tapState.n++;
      SFX.play('tap'); buzz(8);
      document.getElementById('tapCount').textContent = tapState.n + ' / ' + goal;
      var plus = document.createElement('span');
      plus.className = 'pop-plus'; plus.textContent = '+1';
      plus.style.left = btn.style.left; plus.style.top = btn.style.top;
      arena.appendChild(plus); setTimeout(function () { plus.remove(); }, 600);
      move();
    });
    (function tick() {
      if (!tapState) return;
      var left = Math.max(0, tapState.end - performance.now());
      var bar = document.getElementById('tapBar'), tt = document.getElementById('tapTime');
      if (bar) bar.style.width = (left / (def.secs * 10)) + '%';
      if (tt) tt.textContent = (left / 1000).toFixed(1) + 's';
      if (left > 0) return requestAnimationFrame(tick);
      clearInterval(mover);
      var score = tapState.n; tapState = null;
      sh.res = G.tapDone(S.g, score, sh.level);
      sh.phase = 'result';
      celebrate(sh.res);
      render();
    })();
  }

  function shareCard() {
    var g = S.g, cv = document.createElement('canvas'), W = 600, H = 600;
    cv.width = W; cv.height = H;
    var x = cv.getContext('2d');
    var grd = x.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#3EC5FF'); grd.addColorStop(1, '#8EE3FF');
    x.fillStyle = grd; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,.25)';
    for (var i = 0; i < 15; i++) for (var j = 0; j < 15; j++) { x.beginPath(); x.arc(i * 40 + 20, j * 40 + 20, 3, 0, 7); x.fill(); }
    function rr(px, py, w, h, r, fill) { x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath(); x.fillStyle = fill; x.fill(); x.lineWidth = 6; x.strokeStyle = '#2B2250'; x.stroke(); }
    rr(40, 48, W - 80, H - 96, 36, '#FFFFFF');
    rr(W / 2 - 60, 80, 120, 120, 30, g.company.color);
    x.textAlign = 'center'; x.textBaseline = 'middle';

            return navigator.share(data);
          }).catch(function () { A.copyshare(); });
        } else A.copyshare();
      } catch (e) { A.copyshare(); }
      return false;
    },
    copyshare: function () {
      var ta = document.getElementById('shareText');
      var fallback = function () { ta.focus(); ta.select(); toast('Text selected. Copy it! 📋'); };
      try { navigator.clipboard.writeText(ta.value).then(function () { toast('📋 Copied! Paste it to your friends.'); }, fallback); } catch (e) { fallback(); }
      return false;
    },
    setting: function (v) {
      S.settings[v] = !S.settings[v]; G.setSetting(v, S.settings[v]); SFX.play('pop');
      if (v === 'music') { if (S.settings.music) startMusic(); else CS.Music.stop(); }
    },
    togglemusic: function () { A.setting('music'); },
    vip: function () { S.sheet = { type: 'vip' }; },
    buyvip: function () {
      CS.Store.buy().then(function (ok) {
        if (ok) { SFX.play('level'); confetti(100); toast('👑 Welcome to VIP!'); if (S.g) G.fillMissions(S.g); }
        render();
      });
      render();
      return false;
    },
    restorevip: function () { CS.Store.restore().then(function (ok) { toast(ok ? '👑 VIP restored!' : 'No VIP purchase found.'); render(); }); return false; },
    vipoff: function () { CS.Store.demoOff(); toast('Demo VIP turned off.'); },
    confirm: function (v) { S.sheet = { type: 'confirm', what: v }; },
    doconfirm: function () {
      var g = S.g, w = S.sheet.what;
      S.sheet = null;
      if (w === 'newgame') {
        if (g.mode === 'main') { G.recordLegacy(g, 'Started over'); G.clearSave('main'); } else G.clearSave('daily');
        S.g = null; S.screen = 'create'; S.create.step = 0; S.create.name = '';
      } else { g.over = { reason: g.mode === 'daily' ? 'daily' : 'gaveup', week: g.week }; G.checkAchievements(g); endCompany(); }
    },
    restart: function () { S.g = null; S.screen = 'create'; S.create.step = 0; S.create.name = ''; window.scrollTo(0, 0); }
  };

  function onClick(ev) {
    var el = ev.target.closest('[data-a]');
    if (!el) return;
    if ((el.dataset.a === 'scrim' || (el.classList.contains('overlay') && el.dataset.a === 'closeov')) && ev.target !== el) return;
    var fn = A[el.dataset.a];
    if (!fn) return;
    if (fn(el.dataset.v) === false) return;
    render();
  }
  function onInput(ev) {
    if (ev.target.id === 'cname') {
      S.create.name = ev.target.value;
      var p = document.getElementById('cprev'); if (p) p.textContent = ev.target.value || 'Your Company';
    }
  }

  // Android back button: close things first, then go back, then leave the app.
  CS.onBack = function () {
    if ($over.innerHTML) { $over.innerHTML = ''; return true; }
    if (S.sheet) { if (A.scrim() !== false) { render(); return true; } return true; }
    if (S.screen === 'game' && S.tab !== 'home') { A.tab('home'); render(); return true; }
    if (S.screen === 'create') { A.cback(); render(); return true; }
    if (S.screen === 'game' || S.screen === 'over') { A.home(); render(); return true; }
    return false;
  };

  CS.boot = function () {
    $app = document.getElementById('app');
    $sheet = document.getElementById('sheet-root');
    $toast = document.getElementById('toast-root');
    $over = document.getElementById('overlay-root');
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') CS.onBack();
      if (ev.key === 'Enter' && ev.target.id === 'cname') { if (A.cnext() !== false) render(); }
    });
    CS.Scene.onGolden(function () {
      var amt = G.tapGolden(S.g);
      if (amt) { toast('🤑 Golden customer! +' + M(amt)); SFX.play('coin'); coinBurst(16); buzz([20, 20, 20]); render(); }
    });
    CS.Store.onChange(function () { render(); });
    try { CS.Store.init(); } catch (e) {}
    // In the app, the billing plugin is ready after 'deviceready'.
    document.addEventListener('deviceready', function () { try { CS.Store.init(); } catch (e) {} }, false);
    // Native app: Android back button.
    var Cap = globalThis.Capacitor;
    if (Cap && Cap.Plugins && Cap.Plugins.App) {
      Cap.Plugins.App.addListener('backButton', function () { if (!CS.onBack()) Cap.Plugins.App.exitApp(); });
    }
    render();
    // Loading screen: wait for fonts (max 2.5s), then "tap to play" (this also unlocks sound on phones).
    var loader = document.getElementById('loader');
    var ready = function () {
      if (!loader) { S.started = true; return; }
      loader.classList.add('ready');
      loader.addEventListener('click', function () {
        S.started = true;
        loader.classList.add('gone');
        setTimeout(function () { loader.remove(); }, 500);
        SFX.play('level'); startMusic();
      }, { once: true });
    };
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    Promise.race([Promise.all([fontsReady, new Promise(function (r) { setTimeout(r, 1300); })]), new Promise(function (r) { setTimeout(r, 2500); })]).then(ready);
  };
})();
</script>
<script>
  // Random loading tips
  (function () { var t = ['Tip: tap the golden customer 🤑 for bonus cash!', 'Tip: Boss Powers ⚡ are free. Use them!', 'Tip: win the Business Cup 🏆 to beat your rivals!', 'Tip: rename workers after your friends! ✏️', 'Tip: come back every day for a bigger gift 🎁', 'Tip: find all the legendary events 👽 in the Event Book!']; var el = document.querySelector('.ld-tip'); if (el) el.textContent = t[Math.floor(Math.random() * t.length)]; })();
  CS.boot();
  // Offline support when served over http(s). Opening the file directly still works, just without it.
  /*SW*/if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }/*/SW*/
</script>
