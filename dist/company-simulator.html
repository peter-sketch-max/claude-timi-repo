  function eventWeight(g, d, picked) {
    if (d.chainOnly || picked[d.id]) return 0;
    if ((g.cooldowns[d.id] || -99) > g.week) return 0;
    if (d.minWeek && g.week < d.minWeek) return 0;
    if (d.need && g.employees.length < d.need) return 0;
    if (d.cond && !d.cond(g)) return 0;
    if (MINIGAMES[d.kind] && picked._mini) return 0;
    var w = typeof d.w === 'function' ? d.w(g) : (d.w == null ? 1 : d.w);
    return w * CS.RARITY[d.rarity || 'common'].w;
  }

  function rollEvents(g, minor) {
    var inst = [];
    var due = g.pending.filter(function (p) { return p.due <= g.week; });
    g.pending = g.pending.filter(function (p) { return p.due > g.week; });
    due.forEach(function (p) {
      var def = CS.EV[p.id];
      if (def && ctxValid(g, p.ctx) && (!def.cond || def.cond(g, p.ctx))) inst.push({ id: p.id, ctx: p.ctx, chain: true });
    });
    var n = rollCount(g), picked = {};
    inst.forEach(function (x) { picked[x.id] = 1; });
    for (var k = 0, tries = 0; k < n && tries < n * 5; tries++) {
      var def = U.weighted(CS.EVENTS, function (d) { return eventWeight(g, d, picked); });
      if (!def) break;
      picked[def.id] = 1;
      var ctx = castActors(g, def);
      if (ctx && def.init && def.init(g, ctx) === false) ctx = null;
      if (!ctx) continue;
      if (MINIGAMES[def.kind]) picked._mini = 1;
      g.cooldowns[def.id] = g.week + (def.cd || 8);
      inst.push({ id: def.id, ctx: ctx });
      k++;
    }
    var total = inst.length;
    if (total >= 4) g.stats.bigWeeks++;
    if (total >= 5) g.flags.chaos = true;
    var decisions = 0;
    inst.forEach(function (x) {
      var def = CS.EV[x.id];
      if (!ctxValid(g, x.ctx)) return; // an earlier event this week removed someone involved
      if (def.start) G.apply(g, def.start, x.ctx);
      if (!def.choices && !MINIGAMES[def.kind]) {
        G.seen(x.id);
        if (def.rarity === 'legendary') g.flags.legendary = true;
        var txt = G.apply(g, def.fx, x.ctx);
        minor.push(def.icon + ' ' + G.fill(txt || def.text, g, x.ctx));
        G.clampAll(g);
      } else if (decisions < MAX_DECISIONS) {
        decisions++;
        g.queue.push(x);
      } else if (def.choices) {
        // Too busy: your team handles it with the default answer.
        G.seen(x.id);
        var c = def.choices[def.auto != null ? def.auto : def.choices.length - 1];
        var res = G.apply(g, c.fx, x.ctx);
        G.clampAll(g);
        minor.push(def.icon + ' ' + G.fill(def.title, g, x.ctx) + ' Your team chose: "' + G.fill(c.t, g, x.ctx) + '". ' + (res || ''));
      }
    });
    return total;
  }

  // Replaces {a}, {b}, {m}, {rival}, {amt}... in event text.
  G.fill = function (v, g, c) {
    if (typeof v === 'function') v = v(g, c);
    if (v == null) return '';
    c = c || {};
    var ind = CS.IND[g.company.industry];
    return String(v).replace(/\{(\w+)\}/g, function (m, k) {
      if (k === 'a' || k === 'b' || k === 'm') { var e = G.emp(g, c[k]); return e ? G.first(e) : (c[k + 'n'] || 'Someone'); }
      if (k === 'amt') return U.money(c.amt || 0);
      if (k === 'amt2') return U.money(c.amt2 || 0);
      if (k === 'company') return g.company.name;
      if (k === 'front') return ind.front.toLowerCase();
      if (k === 'fronts') return U.plural(ind.front.toLowerCase());
      if (k === 'unit') return ind.unit;
      if (k === 'industry') return ind.name.toLowerCase();
      if (k === 'city') return CS.CITIES[g.company.city].name;
      if (k === 'rival') return c.rival || g.rivals[0];
      if (c[k] != null) return c[k];
      return m;
    });
  };

  // Applies a declarative effect (see events.js for the list of keys) and returns the result text.
  G.apply = function (g, fx, c) {

      lovebirds: Object.keys(g.dating).length > 0, toughboss: s.fired >= 10, fullhouse: s.fullStreak >= 10,
      streak10: g.bestStreak >= 10, level5: g.level >= 5, level10: g.level >= 10, upgrade1: s.upgrades >= 1, maxup: maxed,
      missions10: s.missionsDone >= 10, vswin: s.vsWins >= 1, jackpot: g.flags.jackpot, quiz5: s.quizRight >= 5,
      legendary: g.flags.legendary, book50: book >= 50, book100: book >= 100, rank4: g.rank >= 3, rank7: g.rank >= 6,
      cupgold: g.cups && g.cups.gold > 0, powers10: s.powers >= 10, golden5: s.golden >= 5, pet: !!g.pet,
      daily: g.over && g.over.reason === 'daily', bankrupt: g.over && g.over.reason === 'bankrupt'
    };
    CS.ACHIEVEMENTS.forEach(function (a) {
      if (!g.achievements[a.id] && test[a.id]) { g.achievements[a.id] = g.week || 1; out.push(a); G.addXP(g, 25); }
    });
    return out;
  };

  // ---------- sharing ----------

  G.shareText = function (g) {
    var r = CS.RANKS[g.rank];
    return g.company.logo + ' ' + g.company.name + ' (' + CS.IND[g.company.industry].name + ')\n' +
      r.emoji + ' ' + r.name + ' · CEO level ' + g.level + '\n' +
      '💰 Worth ' + U.short(G.valuation(g)) + ' after ' + g.week + ' weeks\n' +
      '👥 ' + g.employees.length + ' workers · 📱 ' + U.num(g.followers) + ' followers\n' +
      'Can you beat me? #CompanySimulator';
  };
  G.dailyGrid = function (g) {
    var cells = '', h = g.history;
    for (var i = 0; i < 13; i++) {
      var chunk = h.filter(function (x) { return x.week > i * 4 && x.week <= i * 4 + 4; });
      if (!chunk.length) { cells += '⬜'; continue; }
      var net = chunk.reduce(function (s, x) { return s + x.net; }, 0);
      cells += net > G.tierOf(g).rv * 0.05 ? '🟩' : net < 0 ? '🟥' : '🟨';
    }
    return cells;
  };
  G.dailyShare = function (g) {
    return 'Company Sim Daily #' + g.dailyNum + ' ' + g.company.logo + '\n' +
      '💰 ' + U.short(G.valuation(g)) + ' company value\n' +
      G.dailyGrid(g) + '\n' +
      '👥 ' + g.employees.length + ' · 📱 ' + U.num(g.followers) + ' · 🔥 ' + g.stats.virals + ' viral\n' +
      '#CompanySimulator';
  };

  // ---------- saves, legacy, book, settings, daily gift ----------

  G.save = function (g) { g.rng = U.state(); g.savedAt = Date.now(); writeJSON(g.mode === 'daily' ? KEYS.daily : KEYS.main, g); };
  G.load = function (mode) {
    var g = readJSON(mode === 'daily' ? KEYS.daily : KEYS.main);
    if (!g || g.v !== 2) return null;
    if (mode === 'daily' && g.dailyNum !== G.dailyInfo().dailyNum) return null;
    return g;
  };
  // Restores the random number stream and fills in anything older saves are missing.
  G.resume = function (g) {
    if (g.rng != null) U.seed(g.rng);
    if (!g.rivalCos) G.makeRivals(g);
    g.powers = g.powers || {};
    g.cups = g.cups || { gold: 0, silver: 0, bronze: 0 };
    g.avatar = g.avatar || '😎';
    g.stats.powers = g.stats.powers || 0;
    g.stats.golden = g.stats.golden || 0;
    G.fillMissions(g);
  };
  G.clearSave = function (mode) { removeKey(mode === 'daily' ? KEYS.daily : KEYS.main); };

  G.loadLegacy = function () { var d = readJSON(KEYS.legacy); return d && d.companies ? d : { companies: [] }; };
  G.recordLegacy = function (g, reason) {
    if (g.mode === 'daily') return;
    var L = G.loadLegacy();
    L.companies.unshift({ name: g.company.name, logo: g.company.logo, industry: g.company.industry, weeks: g.week, peakCash: g.stats.peakCash, staff: g.stats.maxStaff, reason: reason });
    L.companies = L.companies.slice(0, 30);
    writeJSON(KEYS.legacy, L);
  };

  var bookCache = null;
  G.book = function () { if (!bookCache) bookCache = readJSON(KEYS.book) || {}; return bookCache; };
  G.seen = function (id) { var b = G.book(); if (!b[id]) { b[id] = 1; writeJSON(KEYS.book, b); } };
  G.bookCount = function () { var b = G.book(); return CS.EVENTS.filter(function (d) { return b[d.id]; }).length; };

  G.settings = function () { return Object.assign({ sound: true, vibe: true }, readJSON(KEYS.settings) || {}); };
  G.setSetting = function (k, v) { var s = G.settings(); s[k] = v; writeJSON(KEYS.settings, s); };

  G.dailyBest = function () { return readJSON(KEYS.best) || {}; };
  G.recordDaily = function (g) {
    var b = G.dailyBest(), v = Math.round(G.valuation(g));
    if (!b[g.dailyNum] || v > b[g.dailyNum]) { b[g.dailyNum] = v; writeJSON(KEYS.best, b); }
    return b[g.dailyNum];
  };

  G.GIFTS = [0.3, 0.4, 0.5, 0.7, 0.9, 1.2, 2];
  G.giftStatus = function () {
    var d = readJSON(KEYS.gift) || {}, today = U.today();
    if (d.last === today) return { available: false, day: d.day || 1 };
    var y = new Date(); y.setDate(y.getDate() - 1);
    var yest = y.getFullYear() + '-' + String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
    var day = d.last === yest ? (d.day % 7) + 1 : 1;
    return { available: true, day: day };
  };
  G.claimGift = function (g) {
    var st = G.giftStatus();
    if (!st.available) return 0;
    var amt = U.nice(G.scale(g) * G.GIFTS[st.day - 1] * (G.isVIP() ? 2 : 1));
    g.cash += amt;
    writeJSON(KEYS.gift, { last: U.today(), day: st.day });
    G.news(g, '🎁 Daily gift: ' + U.money(amt), 'good');
    G.save(g);
    return amt;
  };
})();

//

//   news              title = headline, text, choices

//   wheel             slices: [{ label, emoji, color, w, fx, jackpot, bad }]   (spin, golden spin, sure prize, skip)
//   tap               target (emoji), goal, secs, win, lose   (easy, normal, hard, skip)
//   quiz              init makes ctx.q = { q, options (4), answer }, win, lose
//   deal              init sets ctx.offer, accept(g, c) -> fx   (accept, push, push hard, walk away)
//   vs                win, lose, tie   (4 moves)
//   interview         init makes ctx.cand   (4 questions, then 4 ways to hire or pass)
//   post              pick 1 of 4 social media posts
//
// Effect (fx) keys: cash (share of weekly sales, negative = cost), money ($), rep, happy, fans, team,
//   a/b/m (mood of that person), skill/loyal/reliable ({a: n}), rel ['a','b',n], date, breakup,
//   raise ['a', pct], teamRaise, teamBonus, bonus 'a', promote 'a', mgr 'a', demote 'a', fire 'a', quit 'a',

  function quizGen() {
    var t = U.ri(0, 4), q, ans, opts, money = true;
    if (t === 0) {
      var price = U.ri(3, 15), paid = price <= 5 ? 10 : 20; ans = paid - price;
      q = 'A customer buys something for $' + price + '. They pay with $' + paid + '. How much change do you give back?';
      opts = [ans, ans + 1, ans + 2, ans - 1, ans + 3];
    } else if (t === 1) {
      var n = U.ri(2, 9), p = U.ri(2, 6); ans = n * p;
      q = 'You sell ' + n + ' things for $' + p + ' each. How much money did you make?';
      opts = [ans, ans + p, ans - p, n + p, ans + 2 * p];
    } else if (t === 2) {
      var sell = U.ri(8, 20), costx = U.ri(2, sell - 2); ans = sell - costx;
      q = 'You sell a toy for $' + sell + '. It cost you $' + costx + ' to make. How much PROFIT did you make?';
      opts = [ans, sell + costx, ans + 2, ans - 2, ans + 1];
    } else if (t === 3) {
      var full = U.pick([10, 20, 40, 50, 100]), pct = U.pick([10, 20, 50]); ans = full - full * pct / 100;
      q = 'Something costs $' + full + '. It\'s ' + pct + '% off today! What is the new price?';
      opts = [ans, full - pct, full * pct / 100, ans + 5, ans - 5];
    } else {
      var w = U.ri(2, 6), each = U.pick([5, 10, 20, 25]); ans = w * each; money = false;
      q = 'You have ' + w + ' workers. Each one helps ' + each + ' customers a day. How many customers get help in one day?';
      opts = [ans, w + each, ans + each, ans - each, ans + 2 * each];
    }
    var uniq = [];
    opts.forEach(function (o) { if (uniq.indexOf(o) < 0 && o > 0) uniq.push(o); });
    for (var k = 1; uniq.length < 4; k++) if (uniq.indexOf(ans + k * 4) < 0) uniq.push(ans + k * 4);
    uniq = U.shuffle(uniq.slice(0, 4));
    return { q: q, options: uniq.map(function (o) { return (money ? '$' : '') + o; }), answer: uniq.indexOf(ans) };
  }

// VIP subscription.
// In the Play Store app it uses Google Play Billing through cordova-plugin-purchase (window.CdvPurchase).
// On the web there is no way to pay, so VIP can be switched on for free as a demo.
var CS = globalThis.CS = globalThis.CS || {};

(function () {

  var listeners = [];

  function read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function write(v) { try { localStorage.setItem(KEY, JSON.stringify(v)); } catch (e) {} }
  function set(v) {
    if (state.vip === v) return;
    state.vip = v;
    write({ vip: v });
    listeners.forEach(function (f) { try { f(); } catch (e) {} });
  }
  state.vip = !!read().vip;

  function isNative() { return !!(globalThis.Capacitor && globalThis.Capacitor.isNativePlatform && globalThis.Capacitor.isNativePlatform()); }

  CS.Store = {
    PRODUCT: PRODUCT,

    info: function () { return state; },
    onChange: function (f) { listeners.push(f); },

    init: function () {

        .approved(function (t) { t.verify(); })
        .verified(function (r) { r.finish(); refresh(); })
        .productUpdated(refresh)

      store.error(function (err) { state.error = err && err.message || 'Store error'; });
      store.initialize([P.Platform.GOOGLE_PLAY]).then(function () { state.ready = true; refresh(); });

        var p = store.get(PRODUCT, P.Platform.GOOGLE_PLAY);

    if (g.golden && !g.golden.tapped) return 'A <b>golden customer</b> 🤑 is walking by your shop! Tap them in the picture for bonus cash!';

  function wheelSvg(def) {
    var n = def.slices.length, a = 360 / n, r = 96, parts = '';
    function pt(deg, rad) { var t = deg * Math.PI / 180; return (rad * Math.sin(t)).toFixed(2) + ' ' + (-rad * Math.cos(t)).toFixed(2); }
    def.slices.forEach(function (s, i) {
      parts += '<path d="M0 0 L' + pt(i * a, r) + ' A' + r + ' ' + r + ' 0 0 1 ' + pt((i + 1) * a, r) + ' Z" fill="' + s.color + '" stroke="#2B2250" stroke-width="3"/>';
      var mid = (i + 0.5) * a, p = pt(mid, 64).split(' ');
      parts += '<text x="' + p[0] + '" y="' + p[1] + '" font-size="22" text-anchor="middle" dominant-baseline="central" transform="rotate(' + mid + ' ' + p[0] + ' ' + p[1] + ')">' + s.emoji + '</text>';
    });
    return '<div class="wheel-wrap"><span class="wheel-pointer">🔻</span><svg id="wheel" viewBox="-100 -100 200 200" role="img" aria-label="Prize wheel"><circle r="99" fill="#2B2250"/>' + parts + '</svg><div class="wheel-hub">🍀</div></div>';
  }

  // After-render work: number count-ups and the share image.
  function hydrate() {
    document.querySelectorAll('[data-count]').forEach(function (el) {
      var to = +el.dataset.count, from = +(el.dataset.from || 0), fmt = el.dataset.fmt, t0 = performance.now(), dur = 700;
      if (reduced) { el.textContent = fmtVal(to, fmt); return; }
      (function step(t) {
        var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmtVal(Math.round(from + (to - from) * e), fmt);
        if (p < 1) requestAnimationFrame(step);
      })(t0);
    });
    var img = document.getElementById('shareImg');
    if (img && !img.src) img.src = shareCard();
  }

  // ================= week transition =================

  function weekTransition(week, done) {
    if (reduced) return done();

    $over.innerHTML = '<div class="week-flip"><div class="cal-big"><div class="cal-top">WEEK</div><div class="cal-num" id="calNum">' + (week - 1) + '</div><div class="cal-days">' +
      days.map(function (d, i) { return '<span style="animation-delay:' + (0.06 * i) + 's">' + d + '</span>'; }).join('') + '</div></div><div class="flip-coins">💰 🪙 💰</div></div>';
    SFX.play('page');
    setTimeout(function () { var n = document.getElementById('calNum'); if (n) { n.textContent = week; n.classList.add('flip'); } SFX.play('tick'); }, 420);
    setTimeout(function () { $over.innerHTML = ''; done(); }, 900);

  // ================= mini-game engines =================

  function spinWheel(mode) {
    var sh = S.sheet, def = CS.EV[sh.x.id];
    sh.res = G.spin(S.g, mode);
    render();
    var n = def.slices.length, a = 360 / n, target = 360 * 6 - (sh.res.slice + 0.5) * a + (Math.random() - 0.5) * a * 0.5;
    var el = document.getElementById('wheel');
    SFX.play('whoosh');
    requestAnimationFrame(function () { requestAnimationFrame(function () { if (el) el.style.transform = 'rotate(' + target + 'deg)'; }); });
    var ticks = 0, tk = setInterval(function () { if (++ticks > 16) clearInterval(tk); else SFX.play('tick'); }, 180);
    setTimeout(function () { if (S.sheet === sh) { sh.phase = 'result'; celebrate(sh.res); render(); } }, 3600);
  }

  function startTap() {
    var sh = S.sheet, def = CS.EV[sh.x.id], arena = document.getElementById('arena'), goal = G.tapGoal(def, sh.level);
    if (!arena || tapState) return;
    arena.querySelector('.start').remove();
    var btn = document.createElement('button');
    btn.className = 'target'; btn.type = 'button'; btn.textContent = def.target; btn.setAttribute('aria-label', 'Tap');
    arena.appendChild(btn);
    tapState = { n: 0, end: performance.now() + def.secs * 1000 };
    var speed = [1100, 850, 650][sh.level];
    function move() {
      var w = arena.clientWidth - 72, h = arena.clientHeight - 72 - 30;
      btn.style.left = Math.round(Math.random() * w) + 'px';
      btn.style.top = Math.round(30 + Math.random() * h) + 'px';
    }
    move();
    var mover = setInterval(move, speed);
    btn.addEventListener('pointerdown', function (ev) {
      ev.preventDefault();
      if (!tapState) return;
      tapState.n++;
      SFX.play('tap'); buzz(8);
      document.getElementById('tapCount').textContent = tapState.n + ' / ' + goal;
      var plus = document.createElement('span');
      plus.className = 'pop-plus'; plus.textContent = '+1';
      plus.style.left = btn.style.left; plus.style.top = btn.style.top;
      arena.appendChild(plus); setTimeout(function () { plus.remove(); }, 600);
      move();
    });
    (function tick() {
      if (!tapState) return;
      var left = Math.max(0, tapState.end - performance.now());
      var bar = document.getElementById('tapBar'), tt = document.getElementById('tapTime');
      if (bar) bar.style.width = (left / (def.secs * 10)) + '%';
      if (tt) tt.textContent = (left / 1000).toFixed(1) + 's';
      if (left > 0) return requestAnimationFrame(tick);
      clearInterval(mover);
      var score = tapState.n; tapState = null;
      sh.res = G.tapDone(S.g, score, sh.level);
      sh.phase = 'result';
      celebrate(sh.res);
      render();
    })();
  }

  function shareCard() {

    var grd = x.createLinearGradient(0, 0, 0, H);
    grd.addColorStop(0, '#3EC5FF'); grd.addColorStop(1, '#8EE3FF');
    x.fillStyle = grd; x.fillRect(0, 0, W, H);
    x.fillStyle = 'rgba(255,255,255,.25)';

    function rr(px, py, w, h, r, fill) { x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath(); x.fillStyle = fill; x.fill(); x.lineWidth = 6; x.strokeStyle = '#2B2250'; x.stroke(); }
    rr(40, 48, W - 80, H - 96, 36, '#FFFFFF');

    },
    setting: function (v) {
      S.settings[v] = !S.settings[v]; G.setSetting(v, S.settings[v]); SFX.play('pop');
      if (v === 'music') { if (S.settings.music) startMusic(); else CS.Music.stop(); }
    },
    togglemusic: function () { A.setting('music'); },
    vip: function () { S.sheet = { type: 'vip' }; },
    buyvip: function () {
      CS.Store.buy().then(function (ok) {
        if (ok) { SFX.play('level'); confetti(100); toast('👑 Welcome to VIP!'); if (S.g) G.fillMissions(S.g); }
        render();
      });
      render();
      return false;
    },
    restorevip: function () { CS.Store.restore().then(function (ok) { toast(ok ? '👑 VIP restored!' : 'No VIP purchase found.'); render(); }); return false; },
    vipoff: function () { CS.Store.demoOff(); toast('Demo VIP turned off.'); },
    confirm: function (v) { S.sheet = { type: 'confirm', what: v }; },
    doconfirm: function () {
      var g = S.g, w = S.sheet.what;
      S.sheet = null;
      if (w === 'newgame') {
        if (g.mode === 'main') { G.recordLegacy(g, 'Started over'); G.clearSave('main'); } else G.clearSave('daily');
        S.g = null; S.screen = 'create'; S.create.step = 0; S.create.name = '';
      } else { g.over = { reason: g.mode === 'daily' ? 'daily' : 'gaveup', week: g.week }; G.checkAchievements(g); endCompany(); }
    },
    restart: function () { S.g = null; S.screen = 'create'; S.create.step = 0; S.create.name = ''; window.scrollTo(0, 0); }
  };

  function onClick(ev) {
    var el = ev.target.closest('[data-a]');
    if (!el) return;
    if ((el.dataset.a === 'scrim' || (el.classList.contains('overlay') && el.dataset.a === 'closeov')) && ev.target !== el) return;
    var fn = A[el.dataset.a];
    if (!fn) return;
    if (fn(el.dataset.v) === false) return;
    render();
  }
  function onInput(ev) {
    if (ev.target.id === 'cname') {
      S.create.name = ev.target.value;
      var p = document.getElementById('cprev'); if (p) p.textContent = ev.target.value || 'Your Company';
    }
  }

  // Android back button: close things first, then go back, then leave the app.
  CS.onBack = function () {
    if ($over.innerHTML) { $over.innerHTML = ''; return true; }
    if (S.sheet) { if (A.scrim() !== false) { render(); return true; } return true; }
    if (S.screen === 'game' && S.tab !== 'home') { A.tab('home'); render(); return true; }
    if (S.screen === 'create') { A.cback(); render(); return true; }
    if (S.screen === 'game' || S.screen === 'over') { A.home(); render(); return true; }
    return false;
  };

  CS.boot = function () {
    $app = document.getElementById('app');
    $sheet = document.getElementById('sheet-root');
    $toast = document.getElementById('toast-root');
    $over = document.getElementById('overlay-root');
    document.addEventListener('click', onClick);
    document.addEventListener('input', onInput);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') CS.onBack();
      if (ev.key === 'Enter' && ev.target.id === 'cname') { if (A.cnext() !== false) render(); }
    });
    CS.Scene.onGolden(function () {
      var amt = G.tapGolden(S.g);
      if (amt) { toast('🤑 Golden customer! +' + M(amt)); SFX.play('coin'); coinBurst(16); buzz([20, 20, 20]); render(); }
    });
    CS.Store.onChange(function () { render(); });
    try { CS.Store.init(); } catch (e) {}
    // In the app, the billing plugin is ready after 'deviceready'.
    document.addEventListener('deviceready', function () { try { CS.Store.init(); } catch (e) {} }, false);
    // Native app: Android back button.
    var Cap = globalThis.Capacitor;
    if (Cap && Cap.Plugins && Cap.Plugins.App) {
      Cap.Plugins.App.addListener('backButton', function () { if (!CS.onBack()) Cap.Plugins.App.exitApp(); });
    }
    render();
    // Loading screen: wait for fonts (max 2.5s), then "tap to play" (this also unlocks sound on phones).
    var loader = document.getElementById('loader');
    var ready = function () {
      if (!loader) { S.started = true; return; }
      loader.classList.add('ready');
      loader.addEventListener('click', function () {
        S.started = true;
        loader.classList.add('gone');
        setTimeout(function () { loader.remove(); }, 500);
        SFX.play('level'); startMusic();
      }, { once: true });
    };
    var fontsReady = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    Promise.race([Promise.all([fontsReady, new Promise(function (r) { setTimeout(r, 1300); })]), new Promise(function (r) { setTimeout(r, 2500); })]).then(ready);
  };
})();
</script>
<script>
  // Random loading tips
  (function () { var t = ['Tip: tap the golden customer 🤑 for bonus cash!', 'Tip: Boss Powers ⚡ are free. Use them!', 'Tip: win the Business Cup 🏆 to beat your rivals!', 'Tip: rename workers after your friends! ✏️', 'Tip: come back every day for a bigger gift 🎁', 'Tip: find all the legendary events 👽 in the Event Book!']; var el = document.querySelector('.ld-tip'); if (el) el.textContent = t[Math.floor(Math.random() * t.length)]; })();
  CS.boot();
  // Offline support when served over http(s). Opening the file directly still works, just without it.
  /*SW*/if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }/*/SW*/
</script>
